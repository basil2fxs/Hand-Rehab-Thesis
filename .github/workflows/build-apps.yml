# Test, build and release Finger Rehab: the Windows installer, the
# macOS disk image and the EEG lab folder.
#
# PyInstaller cannot cross-compile, so each OS builds its own app on a
# matching GitHub runner. Every push to main runs the test suite and the
# builds. When both pass, the release job publishes the three files as
# the GitHub release for the version the code carries (SOFTWARE_VERSION
# in app/finger_rehab/data/session.py):
#   FingerRehab-Setup-Windows.exe   run it
#   FingerRehab-macOS.dmg           drag to Applications
#   FingerRehab-EEGLab.zip          the lab folder
# A new version number makes a new release; another push of the same
# number replaces that release's files with the newer build. The files
# are also on each run's page for 30 days.
#
# All are self-contained: Python, pygame, numpy, librosa and matplotlib
# ship inside. Nothing to install on the target machine.

name: build-apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

defaults:
  run:
    working-directory: app

jobs:
  # The whole suite, headless, on the platform it is written on. A push
  # whose tests fail still builds (the files stay on the run page) but
  # is never released.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests -q -p no:cacheprovider

  # Compile the two Arduino hexes once, on Linux, and hand them to both
  # app builds. The clinic PC never compiles anything: the app flashes a
  # prebuilt hex with a bundled avrdude. Building here (rather than
  # committing the hexes) is what stops a hex forking from the source it
  # was built from.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The AVR toolchain is about 200 MB and does not change between
      # runs, so caching it turns a two-minute job into a ten-second one.
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ hashFiles('app/arduino/*/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build the hexes
        run: python builds/build_firmware.py

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-hex
          path: app/assets/firmware
          retention-days: 30

  build:
    needs: firmware
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 3.12: newest CPython with mature wheels for the whole stack
      # (librosa's numba dependency lags the very latest Python).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The test job runs on macOS, but the lab PC runs Windows, and the
      # EEG simulator listens for the game differently on each. Its
      # tests run here too, so the Windows side is checked on Windows.
      - name: EEG simulator tests (Windows)
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests/test_eeg_simulator.py -q -p no:cacheprovider

      # One version string for the exe, the app bundle and the
      # installer: SOFTWARE_VERSION in finger_rehab/data/session.py,
      # the same number every session's metadata records.
      - name: Read the version
        shell: bash
        run: echo "APP_VERSION=$(python builds/version.py)" >> "$GITHUB_ENV"

      # The hexes the firmware job just compiled, from this same commit,
      # so a released app can never carry firmware from a different one.
      # Artefacts are scoped to the run, so no token is needed.
      - name: Fetch the firmware hexes
        uses: actions/download-artifact@v8
        with:
          name: firmware-hex
          path: app/assets/firmware

      # avrdude, the uploader the app spawns. Verified against Arduino's
      # published checksum; a failure here only means the Settings panel
      # says avrdude is missing, so it must not fail the build.
      - name: Fetch avrdude
        continue-on-error: true
        run: python builds/fetch_avrdude.py

      - name: Build
        run: python -m PyInstaller --noconfirm --workpath bin/build --distpath bin/dist finger_rehab.spec

      # The built Mac app must flash from its own bundle too.
      - name: Check the flashing tools (macOS)
        if: runner.os == 'macOS'
        run: |
          code=0
          "bin/dist/Finger Rehab.app/Contents/MacOS/Finger Rehab" \
              --check-tools "$RUNNER_TEMP/tools.json" || code=$?
          cat "$RUNNER_TEMP/tools.json" || true
          exit $code

      # macOS: a disk image with the app and an Applications link, the
      # drag target. UDZO is compressed and read-only.
      - name: Make the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          STAGE=bin/dist/dmg
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "bin/dist/Finger Rehab.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Finger Rehab" -srcfolder "$STAGE" \
              -ov -format UDZO bin/dist/FingerRehab-macOS.dmg

      - name: Upload the disk image (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: FingerRehab-macOS
          path: app/bin/dist/FingerRehab-macOS.dmg
          retention-days: 30

      # Windows: Inno Setup ships on the runner image but is not on
      # PATH; call it by its full path and fall back to Chocolatey.
      - name: Find or install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:APP_VERSION" installers\windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Prove the installer installs, registers the auto-start task and
      # uninstalls cleanly. The runner account is an administrator, so
      # this checks the script, not what a standard user can do.
      - name: Install, check, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "-- installing"
          Start-Process "bin\dist\FingerRehab-Setup-Windows.exe" `
            -ArgumentList "/VERYSILENT","/SP-","/SUPPRESSMSGBOXES" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Finger Rehab"
          $exe = "$dir\Finger Rehab.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          Write-Host "-- installed, contents:"
          Get-ChildItem -Path $dir | ForEach-Object { Write-Host "   $($_.Name)" }
          schtasks /Query /TN FingerRehabAutostart | Out-Null
          if ($LASTEXITCODE) { throw "auto-start task missing" }
          Write-Host "-- task registered"
          # Settings' Flash firmware and Sensor address must work from
          # this install alone: both firmware images, the bundled
          # avrdude starting, pyserial, on a runner with no Arduino
          # tools of its own.
          Write-Host "-- flashing tools in the installed copy"
          $report = Join-Path $env:RUNNER_TEMP "tools.json"
          $c = Start-Process -FilePath $exe -ArgumentList "--check-tools","`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { throw "no tools report" }
          if ($c.ExitCode -ne 0) { throw "the installed app cannot flash (exit $($c.ExitCode))" }
          Write-Host "-- the installed app can flash"
          $unins = Get-ChildItem -Path $dir -Filter "unins*.exe" |
            Select-Object -First 1
          if (-not $unins) { throw "no uninstaller in $dir" }
          Write-Host "-- uninstalling with $($unins.Name)"
          Start-Process $unins.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Write-Host "-- uninstaller returned, waiting for it to finish"
          # Inno's uninstaller relaunches itself from temp, so -Wait
          # returns early. Poll rather than race it.
          $gone = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            schtasks /Query /TN FingerRehabAutostart 2>$null | Out-Null
            if ($LASTEXITCODE) { $gone = $true; break }
          }
          if (-not $gone) {
            schtasks /Query /TN FingerRehabAutostart /V /FO LIST
            throw "task survived uninstall"
          }
          Write-Host "-- task removed"
          # The query that proves the task is gone returns non-zero, and
          # a pwsh step inherits the last exit code, so the whole check
          # has to say plainly that it passed.
          exit 0

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FingerRehab-Setup-Windows
          path: app/bin/dist/FingerRehab-Setup-Windows.exe
          retention-days: 30

      # The lab package: the exe, eeg_lab.yaml, run_in_psychopy.py and
      # a fresh source/ copy of the game, nothing else. The same script
      # build_app.bat runs locally assembles it, so the zip and the
      # folder never fork. Built from the same commit as the exe, so
      # the lab version can never lag the game.
      - name: Assemble EEG lab package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/build_lab_package.py --exe "bin/dist/Finger Rehab.exe" --out "bin/dist/Finger Rehab EEG Lab"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path "bin/dist/Finger Rehab EEG Lab" -DestinationPath "bin/dist/FingerRehab-EEGLab.zip"

      - name: Upload EEG lab package (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FingerRehab-EEGLab
          path: app/bin/dist/FingerRehab-EEGLab.zip
          retention-days: 30

      # Start the lab exe the way the lab does, from a copy of the
      # folder with nothing plugged in. There is no COM10 here, so it
      # must open on the trigger box picker and stay up, say in its log
      # that the eeg_lab.yaml beside it put it in lab mode, and leave
      # no auto-start task behind on the machine. Nothing else in CI
      # ever starts the lab build.
      - name: Smoke-run the lab exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $lab = Join-Path $env:RUNNER_TEMP "labrun"
          Copy-Item -Recurse "bin/dist/Finger Rehab EEG Lab" $lab
          $p = Start-Process -FilePath (Join-Path $lab "Finger Rehab.exe") -WorkingDirectory $lab -PassThru
          $log = Join-Path $lab "sessions/rehab.log"
          # Wait for the line itself, up to two minutes. A cold start on a
          # fresh runner took 10 s one day and 30 s the next, so a fixed
          # 30 s wait failed a build that was fine.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "waiting on the port picker" -Quiet)) { break }
            Start-Sleep -Seconds 1
          }
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not (Test-Path $log)) {
            Write-Host "No log at $log"
            Get-ChildItem -Recurse $lab -Depth 2 | Select-Object FullName
            exit 1
          }
          Get-Content $log
          if (-not $alive) { Write-Host "The lab exe exited early, code $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "running in EEG lab mode" -Quiet)) { Write-Host "Not in lab mode"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "waiting on the port picker" -Quiet)) { Write-Host "Did not reach the port picker"; exit 1 }
          schtasks /Query /TN FingerRehabAutostart 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "The lab exe registered auto-start"; exit 1 }
          Write-Host "Lab exe: lab mode, port picker, no auto-start."
          exit 0

  # Publish the build as the release for its version. Only a push to
  # main (or a manual run on main) whose tests and builds all passed
  # gets here. The tag v<version> is moved to this commit, so a
  # release's files and its tag always come from the same build. A
  # newer push cancels an older one still waiting, so the newest build
  # wins. Every GitHub call is retried, because one HTTP 500 during an
  # upload once left the previous build's files in place, and the last
  # step fails the run unless the release now carries this commit's
  # three files and is the one marked latest.
  release:
    needs: [test, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        run: echo "APP_VERSION=$(python3 builds/version.py)" >> "$GITHUB_ENV"

      - name: Fetch the three files
        uses: actions/download-artifact@v8
        with:
          pattern: FingerRehab-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          DIST="$GITHUB_WORKSPACE/dist"
          ls -l "$DIST"
          for f in FingerRehab-Setup-Windows.exe FingerRehab-macOS.dmg FingerRehab-EEGLab.zip; do
            test -f "$DIST/$f" || { echo "missing $f"; exit 1; }
          done
          python3 builds/release_notes.py "$APP_VERSION" "$GITHUB_SHA" > notes.md
          # Up to five tries, 30, 60, 90 and 120 s apart, for the
          # transient errors GitHub's API returns under load.
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: $*"
              sleep $((i * 30))
            done
            return 1
          }
          if gh release view "$TAG" > /dev/null 2>&1; then
            retry sh -c 'gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$0" -f sha="$GITHUB_SHA" -F force=true > /dev/null || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$0" -f sha="$GITHUB_SHA" > /dev/null' "$TAG"
            retry gh release upload "$TAG" "$DIST"/FingerRehab-* --clobber
            retry gh release edit "$TAG" --title "Finger Rehab $APP_VERSION" \
              --notes-file notes.md --latest
          else
            retry gh release create "$TAG" "$DIST"/FingerRehab-* \
              --target "$GITHUB_SHA" --title "Finger Rehab $APP_VERSION" \
              --notes-file notes.md --latest
          fi

      - name: Check the release is this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          DIST="$GITHUB_WORKSPACE/dist"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --jq .object.sha)
          test "$sha" = "$GITHUB_SHA" || { echo "tag $TAG is $sha, not $GITHUB_SHA"; exit 1; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$TAG" || { echo "latest release is $latest, not $TAG"; exit 1; }
          gh release view "$TAG" --json body --jq .body | grep -q "${GITHUB_SHA:0:7}" \
            || { echo "release notes do not name ${GITHUB_SHA:0:7}"; exit 1; }
          for f in FingerRehab-Setup-Windows.exe FingerRehab-macOS.dmg FingerRehab-EEGLab.zip; do
            want=$(stat -c %s "$DIST/$f")
            got=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$f\") | .size")
            test "$want" = "$got" || { echo "$f is $got bytes on the release, $want built"; exit 1; }
          done
          echo "Release $TAG is commit ${GITHUB_SHA:0:7}, marked latest, all three files this build's."
