# Build the standalone Finger Rehab apps for macOS and Windows.
#
# PyInstaller cannot cross-compile, so each OS builds its own app on a
# matching GitHub runner. Run it from the Actions tab (workflow_dispatch)
# or push a tag like v1.0.0. Download the artefacts from the run page:
#   FingerRehab-macOS.zip    -> Finger Rehab.app (double-click)
#   FingerRehab-Windows.zip  -> Finger Rehab/Finger Rehab.exe (double-click)
#
# Both are fully self-contained: Python, pygame, numpy, librosa and
# matplotlib all ship inside. Nothing to install on the target machine.
# Windows builds as ONE file (Finger Rehab.exe); macOS as the .app.

name: build-apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  # Compile the two Arduino hexes once, on Linux, and hand them to both
  # app builds. The clinic PC never compiles anything: the app flashes a
  # prebuilt hex with a bundled avrdude. Building here (rather than
  # committing the hexes) is what stops a hex forking from the source it
  # was built from.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The AVR toolchain is about 200 MB and does not change between
      # runs, so caching it turns a two-minute job into a ten-second one.
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ hashFiles('arduino/*/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build the hexes
        run: python builds/build_firmware.py

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: assets/firmware
          retention-days: 30

  build:
    needs: firmware
    strategy:
      matrix:
        include:
          - os: macos-latest
            artefact: FingerRehab-macOS
          - os: windows-latest
            artefact: FingerRehab-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 3.12: newest CPython with mature wheels for the whole stack
      # (librosa's numba dependency lags the very latest Python).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The hexes the firmware job just compiled, from this same commit,
      # so a released app can never carry firmware from a different one.
      # v4 artefacts are scoped to the run, so no token is needed.
      - name: Fetch the firmware hexes
        uses: actions/download-artifact@v4
        with:
          name: firmware-hex
          path: assets/firmware

      # avrdude, the uploader the app spawns. Verified against Arduino's
      # published checksum; a failure here only means the Settings panel
      # says avrdude is missing, so it must not fail the build.
      - name: Fetch avrdude
        continue-on-error: true
        run: python builds/fetch_avrdude.py

      - name: Build
        run: python -m PyInstaller --noconfirm --workpath bin/build --distpath bin/dist finger_rehab.spec

      - name: Zip bundle (macOS)
        if: runner.os == 'macOS'
        run: cd bin/dist && ditto -c -k --keepParent "Finger Rehab.app" "${{ matrix.artefact }}.zip"

      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "bin/dist/Finger Rehab.exe" -DestinationPath "bin/dist/${{ matrix.artefact }}.zip"

      # The lab package: the exe, eeg_lab.yaml, run_in_psychopy.py and
      # a fresh source/ copy of the game, nothing else. The same script
      # build_app.bat runs locally assembles it, so the zip and the
      # folder never fork. Built from the same commit as the exe, so
      # the lab version can never lag the game.
      - name: Assemble EEG lab package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/build_lab_package.py --exe "bin/dist/Finger Rehab.exe" --out "bin/dist/Finger Rehab EEG Lab"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path "bin/dist/Finger Rehab EEG Lab" -DestinationPath "bin/dist/FingerRehab-EEGLab-Windows.zip"

      - name: Upload EEG lab package (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FingerRehab-EEGLab-Windows
          path: bin/dist/FingerRehab-EEGLab-Windows.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: bin/dist/${{ matrix.artefact }}.zip
          retention-days: 30
