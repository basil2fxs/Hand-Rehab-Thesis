# Lab preset for EEG sessions. Loaded OVER config/default.yaml by
#   python main.py --config config/eeg_lab.yaml
# which is what docs/lab_package/run_in_psychopy.py runs from source.
# The frozen exe also loads a copy of this file on its own whenever
# one sits in the same folder, which is how the lab package's exe
# starts in lab mode from a bare double-click.
# Only the lab deltas live here: the game itself is the same engine,
# the same modes and the same main.py as the shipping build, so every
# future game change is automatically the lab version too.
#
# See docs/eeg_lab_setup.txt for the lab-computer checklist.

eeg:
  enabled: true
  # The EEG marker on the lab's Windows PC: an Arduino on COM10 that
  # puts each byte the game sends onto the EEG's trigger lines. Being
  # an Arduino it looks like a hand board, so this port is kept off
  # the hand boards. If it comes up on another COM number the game
  # opens on a port list instead of the login, and the port picked
  # there is saved on this line. Settings, EEG box has the same list
  # and takes a port back from the hand boards. By hand: Device
  # Manager, Ports (COM & LPT), unplug it and watch which entry goes.
  port: COM10
  # The lab's old SRT script opened this port at pyserial's default,
  # 9600, and the marker's sketch reads at that rate. 1200 is refused:
  # it resets some boards into their bootloader. Opening the port
  # restarts an Uno-type Arduino (about 2 s); the first marker goes out
  # at the first game, long after.
  baud: 9600
  # Refuse to start without the box: a lab block recorded with no
  # markers is worthless, so failing loudly at launch is the feature.
  require_port: true
  # The game sends its own 0 byte on the first frame at least this long
  # after a code, so a marker that holds each byte until the next one
  # gives pulses of 8 to 17 ms at 60 Hz: 2 or more samples at 256 Hz
  # and up. Raise it for an amplifier that needs longer pulses.
  pulse_ms: 8
  # Quiet time after the 0 byte, so two codes never run together.
  gap_ms: 12
  # Documentation only, copied into metadata.json: which device sent
  # the markers, and that each pulse ends at the game's own 0 byte.
  box: arduino
  box_mode: simple
  # The amplifier's sampling rate, if known, fills the sample column
  # of events.tsv (round(onset * rate)). Left unset the column reads
  # n/a and the onset column in seconds is all a pipeline needs.
  # Confirm the ActiView rate on the lab desktop before setting it.
  amplifier_rate_hz: null
  # FRN bytes (140 full ring, 141 open ring, 142 half ring) in the
  # modes where the feedback stands on its own. Every byte holds the
  # line 20 ms, and in the fast modes a feedback byte 800 ms after a
  # press lands among the next trial's stimulus and press bytes and
  # pushes them late in the recording (syllables' 800 ms trial gap
  # puts it on the next stimulus exactly). Reaction and chords leave
  # 1.5 s or more before the next stimulus; force_pilot's 141 marks
  # the frame the craft leaves the corridor and stalls (with or
  # without the exit buzz, which cue.buzz_after gates), with no press
  # bytes to collide with.
  feedback_markers: [reaction, chords, force_pilot]

reaction:
  # Fixed-foreperiod CNV variant with the visible ready cue. See the
  # fp_eeg_fixed_s comment in config/default.yaml for why EEG blocks
  # trade the flat hazard away.
  fp_eeg_fixed_s: 2.5

protocol:
  # No session lengths in the lab. A length starts its games at LOG IN,
  # before the RA has started ActiView's recording under the name the
  # game menu shows, and the home lengths play the app's own Reaction
  # block rather than the lab's task. The hub offers Lab session
  # instead, which runs the lab's sitting below, as it always has.
  trials: []
  presets:
    study_battery:
      # Lab session plays the lab's own SRT (the Reaction
      # card, modes/srt.py) once, where the study plays its first
      # Reaction block, and leaves the second Reaction block out. The
      # rest that stood before that block moves to the next one.
      swap_once:
        reaction: srt
      # No Muscle Memory in the lab (Basil, 29 September 2026). The SRT
      # plays before it in both orders and ends by asking whether the
      # participant noticed a repeating sequence, so by Muscle Memory
      # they know sequences exist, and its score would not pool with
      # the study's. The SRT is the lab's sequence learning measure. A
      # rest before a left-out block moves on.
      leave_out:
        - pattern
      # The SRT opens the sitting in both orders (1 October 2026, the
      # SRT deep review): the script ran as a task of its own, and in
      # order B it would otherwise follow about nine minutes of play,
      # Buzz Hunt's replay of buzz sequences on the same fingers among
      # them. The sitting's length does not change.
      move_first:
        - srt
      # A lab sitting is not the healthy study's sitting, so it keeps
      # its own id. Its clock allows for the SRT's 15 minutes in place
      # of two short Reaction blocks. v2 (28 September 2026) follows
      # the study sitting's v3: no Syllables, and Rhythm a second
      # time after the rest. v3 (29 September 2026) leaves out Muscle
      # Memory, 6.3 min of v2's 54.6. Timed headless with
      # scripts/measure_battery.py --config config/eeg_lab.yaml: median
      # 48.1 to 48.2 min over twelve simulated sittings, six per
      # order, range 48.0 to 48.2, the SRT block 14.6 of it. The
      # budget and hard stop keep v2's margins over the median.
      # Re-time it on the lab rig.
      id: eeg_lab_srt_v3
      budget_min: 51
      hard_stop_min: 56

force_pilot:
  # No background track in the lab: an EEG block is recorded in
  # silence so the only sounds in the record are the cues themselves.
  music_enabled: false

srt:
  # The script's own display in EEG recordings (1 October 2026, the SRT
  # deep review): a black page and four grey squares near the centre,
  # the target turning red. The script set its squares close together
  # to limit eye movements; the app's outer cards sit about three
  # times further out and each lights a different brightness. Timing,
  # tones, markers and files are the same in both looks.
  look: lab
  # Response bytes as well as the 30: 100 plus the lane for a correct
  # press, 110 plus the lane for a wrong one, 120 plus the lane for an
  # anticipation and 130 for a miss. Written at the trial's end, each
  # with the press time as t_event in the marker log, so response
  # epochs are re-aligned to t_event, not to the byte's onset. The
  # lab's own EEG SRT coded responses (Lum et al. 2025), and the
  # error-related negativity and response-locked activity need them.
  # The 30 stays the flash, so an epoch on 30 is unchanged.
  response_markers: true

ui:
  # Minimal feedback for the lab. No words after a trial: one ring
  # glyph per outcome (filled for a hit, half for Late or Early, open
  # for a Miss), identical size, position, colour and lifetime, so the
  # only thing that differs between outcomes in the visual record is
  # the fill. Words carry emotion, and emotional words produce an ERP
  # of their own at 200 to 300 ms (the early posterior negativity),
  # right on top of the feedback-related negativity at 230 to 350 ms.
  # No streak banners and no NEW BEST chip either: both are
  # unscheduled visual events in the middle of a trial sequence.
  feedback_style: neutral
  # Fixed gap between the press and the glyph so the feedback ERP is
  # not smeared into the response-locked activity. The 140 / 141
  # marker is written on the flip that draws the glyph, not at log
  # time. Do not change this mid-study: it moves the feedback epoch.
  feedback_delay_ms: 800

cue:
  # No chime and no thunk after a press. Both are auditory events at
  # 100 to 200 ms, inside the feedback window, and the thunk only ever
  # fires on a miss, so leaving it on would put an auditory ERP on
  # exactly one half of the hit / miss contrast. The before-press cue
  # switches are untouched: the stimulus still buzzes and sounds.
  sound_after: false
