; SingleTact address tool. A second, tiny sketch the app flashes in
; place of the game firmware for one job, then replaces again.
;
; Two envs because a Nano can carry either bootloader and the board
; name is how PlatformIO picks the upload baud. The compiled hex is
; identical for both, so the app ships one file and lets avrdude try
; 115200 then 57600.
;
; No upload_port and no extra_scripts on purpose: the app never runs
; PlatformIO, it runs avrdude against the hex this project produces.

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
