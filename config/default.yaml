# Default config. Override by passing --config path/to/your.yaml.

session:
  data_dir: sessions
  participant: null
  # Age captured on the title screen alongside the participant name.
  # Kept as a string so the JSON round-trips raw user input (e.g.
  # "65y" or "NA"). An empty value means "not provided".
  age: null
  # ---- participant details, set these before a participant session --
  # Recorded into metadata.json. They cannot be recovered afterwards,
  # and some analyses cannot run without them.
  #
  # affected_side matters most. Bilateral asymmetry is a signed number,
  # so pooling a cohort where some people are impaired on the left and
  # some on the right cancels the group mean toward zero and reads as
  # no asymmetry when it is actually large. Recording the side lets the
  # analysis flip the sign per participant.
  affected_side: null        # left | right | null when not applicable
  dominant_hand: null        # left | right
  # Impairment score at consent, e.g. "Fugl-Meyer UE 42/66". Free text
  # so the scale is recorded alongside the number. Needed to show the
  # cohort matches the moderate-impairment population the 65 to 80
  # percent challenge band was chosen for.
  impairment_score: null
  # Hand measurements in mm for the ANSUR II percentile check behind
  # the chassis sizing objective.
  hand_length_mm: null
  hand_breadth_mm: null

report:
  # Build researcher outputs at the end of every block: report.html,
  # summary.csv and charts/ inside the session folder, plus one line
  # per block in sessions/sessions_index.csv. Needs matplotlib for the
  # charts; tables still generate without it. Set false to skip.
  enabled: true

serial:
  port: auto
  baud: 115200
  read_timeout_s: 0.02
  open_retries: 3
  open_retry_delay_s: 1.0
  # Explicit per-hand port assignments. When set, these override the
  # auto plug-order assignment (first detected = right, second = left).
  # Set from the Settings screen on the title page, persisted to
  # config/user_settings.yaml. null means "auto-pick".
  left_port: null
  right_port: null
  vendor_ids:
    - "0x2341"   # Arduino LLC
    - "0x239A"   # Adafruit
    - "0x10C4"   # SiLabs CP210x
    - "0x1A86"   # CH340
    - "0x0403"   # FTDI

fsr:
  num_sensors_per_hand: 4
  sample_rate_hz: 200
  # Baseline tracker. This is an EMA per sample; at the device's 200 Hz
  # the time constant is 1 / (alpha * 200) seconds. It exists to absorb
  # slow thermal and mechanical drift, NOT to follow a press.
  #
  # This was 0.02 (a 0.25 s time constant), which is faster than a weak
  # or slow press builds. The baseline chased the press upward and the
  # signal never crossed the threshold, so a patient pressing gently
  # over a second or two registered nothing at all. At 0.0005 the
  # constant is about 10 s: drift is still absorbed, presses are not.
  baseline_alpha: 0.0005
  value_alpha: 0.35
  # PRESS THRESHOLDS, measured per finger on the real device.
  #
  # Detection is relative to each sensor's own live baseline, so these
  # travel with the hardware rather than needing a fresh calibration on
  # every machine. They are set from what a hand actually does on the
  # pads, not from how hard a healthy person can press, which is what
  # makes them usable by a weak finger.
  #
  # Resting noise on this device is about 1.1 counts SD per sensor.
  #
  # MEASURED against a resting hand with tools/calibrate_rest_vs_press.py
  # (29 July 2026). Counts are above the empty-device reading:
  #
  #   finger   resting hand   gentle press   usable gap
  #   index         +2.5          +51.5          49
  #   middle        +8.9          +40.9          32
  #   ring         +11.5          +41.5          30
  #   pinky        +30.7         +145.7         115
  #
  # The earlier uniform 12 was UNSAFE: the pinky pad carries +30.7 at
  # rest, so a hand merely resting on the device sat above the trigger
  # and fired phantom presses continuously. A threshold derived only
  # from an empty device cannot see that; it has to be measured with a
  # hand in the normal resting position.
  #
  # These are RELATIVE TO THE TRACKED BASELINE, which already sits at
  # the resting level. So a trigger only has to cover the gap between
  # resting and pressing, not the absolute load on the pad.
  #
  # An earlier set added the resting load on top of a fraction of the
  # gap, which counted that load twice: the baseline had already
  # absorbed it. The pinky suffered worst, ending up needing 67% of its
  # available gap against 45% for the index, and 6.77 N in absolute
  # terms. That is above the 5.60 N maximum Demouche recorded for a
  # HEALTHY little finger, so the trigger was out of reach of the
  # patients the device is for.
  #
  # Each trigger is now 40% of that finger's gap, with a floor of
  # (resting load + 3 SD of noise). The floor only matters in one case:
  # if a block starts with the hand off the device, the baseline
  # initialises to the empty reading, and the hand landing looks like a
  # rise. The floor keeps that below the trigger. It binds on the ring
  # finger only, and it does NOT inflate the pinky, whose 40%-of-gap
  # value already clears its resting load comfortably.
  #
  #   finger   gap   trigger   % of gap   force
  #   index     49      20        40%     1.72 N
  #   middle    32      13        40%     1.13 N
  #   ring      30      15        49%     1.30 N
  #   pinky    115      46        40%     4.04 N
  #
  # HONEST LIMIT on the pinky. 4.04 N is a real improvement on 6.77 N
  # and is now under Demouche's healthy maximum, but it is still above
  # the 2.66 N healthy MEAN. The pinky pad reads 115 counts for a press
  # described as gentle, three to four times the other fingers, which
  # is a pad placement problem rather than a patient problem. Two things
  # fix it properly: reduce the resting load on that pad in hardware, or
  # run the in-app calibration with the actual patient, which sets every
  # trigger from THEIR light press instead of from these figures.
  #
  # Anything measured by the in-app calibration overrides these. Treat
  # them as the starting point for an uncalibrated device.
  on_delta: [20, 13, 15, 46]
  off_delta: [10, 6, 6, 23]
  # Absolute floors are a broken-sensor guard, not part of normal
  # detection. Real baselines sit at 235-260, so 150 never binds during
  # a session; it only stops a sensor whose reading has collapsed to 0
  # (an I2C fault, which the firmware reports as 0) from registering
  # phantom presses. abs_off_max is set high so it never clips release.
  abs_on_min: [150, 150, 150, 150]
  abs_off_max: [1000, 1000, 1000, 1000]
  debounce_ms: 100

game_cue:
  # WHICH CUE THE PATIENT GETS: the screen, the buzzer, or both.
  #
  # This is the comparison the whole project line started from. Palmer
  # (2024) found reaction time differed between an LED-only cue and all
  # cues together, and the 2023 device existed to test exactly that.
  # Until now the buzzer fired on every trial in every mode, so there
  # was no contrast left to measure.
  #
  #   both      screen highlights the finger AND the motor buzzes
  #   visual    screen only, no buzzer
  #   vibration buzzer only, the screen does not reveal the finger
  #
  # "vibration" is the interesting one for a thesis: the patient has to
  # work out which finger to press from touch alone, which is the
  # condition that isolates the tactile channel. It is also the harder
  # condition, so expect a lower hit rate and a longer reaction time.
  #
  # Recorded per trial as the cue_mode column, so blocks run under
  # different settings can be compared directly in the analysis.
  # Changed from the Settings screen.
  mode: both

motor:
  # Buzzer (vibration) cue. The motor on the TARGET finger buzzes when
  # that trial's stimulus fires, so the patient feels which finger to
  # press rather than only reading it off the screen. This is the
  # buzzer's only job: nothing buzzes on a press, a hit, or a miss.
  # Applies to every mode (classic, adaptive, mirror, rhythm), and in
  # mirror mode both target fingers buzz together.
  # Toggled from the Settings screen; on by default.
  enabled: true
  # How long the cue buzzes, in milliseconds.
  #
  # The firmware (Arduino_20251111.ino) drives the motor at a FIXED
  # strength: STIM_PWM = 200 is a compile-time constant and the only
  # commands it accepts are "STIM:n" and "STOP". Vibration amplitude
  # therefore cannot be changed from the host at all. What we can
  # change is duration: each STIM re-arms the motor for another 150 ms,
  # so the engine repeats pulses to hold it on for longer. That is what
  # this setting and the Settings slider control, and it is what makes
  # a cue feel stronger or gentler in practice.
  #
  # Default 250 ms, chosen from the vibrotactile literature rather
  # than from what the firmware happens to do in one pulse:
  #
  #  - About 30 ms is the minimum duration for a vibrotactile stimulus
  #    to be perceived as a vibration rather than a single pulse
  #    (Vibrotactile stimulus duration threshold, PMC11814341). 250 ms
  #    sits roughly 8x above that floor, so perception is not marginal.
  #  - Vibrotactile cueing studies use burst durations across roughly
  #    25-400 ms, so 250 ms is mid-range and not an outlier.
  #  - Cutaneous sensation is impaired in about a third of stroke
  #    patients and is 40-84% worse on the more-affected side
  #    (PMC4133225), and roughly 40% greater stimulation is needed for
  #    initial perception on the paretic hand (PMC12742966).
  #
  # That last point is the deciding one. The usual way to compensate
  # for a raised perception threshold is more intensity, but this
  # firmware fixes drive strength at STIM_PWM = 200 and exposes no way
  # to change it. Duration is the only compensating lever available,
  # so the default is set longer than a single 150 ms pulse to give a
  # patient with reduced sensation a cue they can actually feel.
  #
  # Range worth staying inside: 150 ms (one pulse, healthy sensation)
  # up to about 400 ms (upper end of the tested range; beyond this the
  # cue starts running into the patient's own response).
  # tools/calibrate_buzzers.py sets this per device and also checks
  # each motor is wired to the finger the software thinks it is.
  cue_ms: 250
  # Gap between repeat pulses when cue_ms asks for more than one. Must
  # stay under the firmware's 150 ms hold or the motor stutters
  # instead of running continuously.
  pulse_interval_ms: 120
  # WHICH STIM CHANNEL DRIVES WHICH FINGER.
  #
  # Arduino_20251111.ino is the final firmware and is not being
  # changed. It maps STIM:1..4 onto its motor pins in a fixed order,
  # so if a motor is wired to a different pin than that order assumes,
  # the wrong finger buzzes. Rather than touch the sketch, the host
  # sends whichever channel actually reaches the finger it means.
  #
  # Read this as: to buzz the INDEX finger send STIM:<first entry>,
  # for MIDDLE send STIM:<second>, and so on. The default 1,2,3,4 is
  # the straight-through case where the wiring matches the sketch.
  #
  # Discover the real mapping with tools/calibrate_buzzers.py, which
  # buzzes each channel and asks which finger you felt. It writes the
  # result here so the game uses it from then on.
  channel_map: [1, 2, 3, 4]

bilateral:
  hand: right            # right | left | both
  per_hand_calibration: true

game:
  mode: adaptive         # classic | adaptive | rhythm
  # Classic-mode pacing. 1.2 s between stim onsets + 1.0 s timeout means the
  # patient has up to ~2.2 s per trial, which is comfortable starting pace
  # for most patients. Adaptive mode ignores trigger_interval_s and
  # drives cadence from the engine's BPM instead.
  trigger_interval_s: 1.2
  timeout_s: 1.0
  early_window_s: 0.1
  total_trials: 40
  # Pre-start "GET READY" countdown (seconds) shown before the first
  # stim on the cadence modes (classic / adaptive / mirror). Gives the
  # patient a moment to settle their hand on the device. Rhythm mode
  # uses its own musical lead-in and ignores this. Test mode trims it
  # to keep quick demos quick.
  start_countdown_s: 5.0
  # Test Mode is a supervisor-demo shortcut. When enabled, every block
  # (classic / adaptive / rhythm) is capped at test_mode_trials trials
  # so the full pipeline (mode select -> setup -> gameplay -> results)
  # fits inside a 60-second demo. Rhythm mode trims the beatmap to the
  # first N notes; the audio still plays the full track. Researcher
  # runs should keep test_mode_enabled=false so the trial CSVs hold the
  # normal 40-48-trial blocks. Toggleable from the Settings screen.
  test_mode_enabled: false
  test_mode_trials: 6
  # Unilateral RIGHT-hand keymap. Patient rests their right hand on the
  # home row so j (index finger, closest to centre) is lane 0 and ; (little
  # finger, outer edge) is lane 3. Lanes always go 0=index..3=little.
  keyboard_map:
    j: 0           # right index
    k: 1           # right middle
    l: 2           # right ring
    semicolon: 3   # right little
  # Unilateral LEFT-hand keymap. Patient rests their left hand on the home
  # row so f (index, closest to centre) is lane 0 and a (little, outer
  # edge) is lane 3. Same lane convention as right so the rest of the game
  # logic doesn't care which hand.
  keyboard_map_left:
    f: 0           # left index
    d: 1           # left middle
    s: 2           # left ring
    a: 3           # left little
  # Bilateral keymap (both hands). Lanes 0..3 = right hand, 4..7 = left.
  keyboard_map_bilateral:
    j: 0           # right index
    k: 1           # right middle
    l: 2           # right ring
    semicolon: 3   # right little
    f: 4           # left index
    d: 5           # left middle
    s: 6           # left ring
    a: 7           # left little

adaptive:
  # Start slow so the patient gets confident hits before the system
  # speeds up. Lowered from 60 -> 30 BPM = 2.0 s between stimuli.
  # 60 BPM (1.0 s) was opening the first block above the comfortable
  # press cadence for stroke-rehab patients, which pushed hit-rate
  # below the 65-80% challenge-point band and bounced the engine
  # straight into recovery. From 30 BPM the patient can string a
  # streak together; the engine bumps up by bpm_step every time it
  # sees a sustained hit rate above target_high.
  start_bpm: 30
  bpm_min: 10                 # crawl mode for severe weakness (6s gap)
  bpm_max: 140
  bpm_step: 10                # base step. Scaled up when hit rate is far off.
  target_low: 0.65            # aim for the 65-80% band around the 70% target
  target_high: 0.80
  weakness_bias: 2.5
  min_trials: 2               # react after just two trials, not eight
  block_size: 4               # regenerate the sequence + reweight every 4 trials
  # Timeout scales with cadence so a slow pace gives more time to press.
  # timeout_s = cadence * timeout_factor.
  timeout_factor: 0.90

scoring:
  # Reaction-time bands for classic + adaptive trials. The patient's
  # press is timed from the stim firing; the band determines both the
  # outcome label shown on screen and the points awarded.
  #
  #   RT  <= perfect_ms  -> "Perfect"  +perfect_points
  #   RT  <= great_ms    -> "Great"    +great_points
  #   RT  <= good_ms     -> "Good"     +good_points
  #   RT  >  good_ms     -> "Late"     +late_points
  #   no press           -> "Miss"     +miss_points
  #
  # The 10/6/3/1 spread is intentionally wider than the historical
  # 3/2/1 - that earlier scheme made the difference between a 150 ms
  # press and a 600 ms press only +2 points, which on a single trial
  # was invisible. Now a Perfect is worth 10x a Late so the patient
  # FEELS the variance in real time.
  perfect_ms: 100
  perfect_points: 10
  great_ms: 200
  great_points: 6
  good_ms: 500
  good_points: 3
  late_points: 1
  # Missed trials + early presses default to 0 (score still won't go
  # below zero, the floor is enforced in engine._apply_wrong_penalty).
  miss_points: 0
  early_penalty: 0
  # Wrong-finger press penalty. Subtracts this many points on EVERY
  # wrong-finger press during a trial (classic + adaptive) and on
  # every unmatched press in rhythm mode. Tuned against the wider
  # point spread above: at penalty=3, mashing 3 wrong fingers costs
  # -9, which overwhelms even a great hit (+6). A Perfect (+10) can
  # still net positive with one wrong (+1), but a focused Perfect
  # (+10) always beats the spam outcome - so the dominant strategy
  # is "press one finger fast", not "mash everything". Floored at
  # score=0 so the display never goes negative. Set to 0 to disable.
  wrong_press_penalty: 3
  # Idle-press penalty. Subtracts this many points per press that
  # lands in classic / adaptive while NO trial is active (between
  # stims). Without it, mashing between trials cost nothing because
  # the press handler short-circuited. Detector debounce_ms already
  # rate-limits the spam at the hardware layer, so this just makes
  # each accepted between-trial press cost something. Smaller than
  # wrong_press_penalty (1 vs 3) because a legitimate finger fidget
  # shouldn't punish as hard as actively pressing the wrong key
  # during a trial. Set to 0 to disable.
  idle_press_penalty: 1

metrics:
  # Miss-force window. For every trial the engine tracks each finger's
  # peak reading (minus baseline) over this many milliseconds after the
  # go stimulus. On a MISSED trial it sums that peak across all fingers
  # and accumulates it, so the results screen can report how much total
  # force the patient was applying across the whole hand when they failed
  # the trial. Units are raw sensor counts (no newton calibration is
  # configured), and the value reads 0 in keyboard mode (no FSRs).
  miss_force_window_ms: 1000

mirror:
  # Bilateral coordination is harder than unimanual cued press so
  # mirror opens slower than adaptive (which starts at 30). Patient
  # needs to land both same-finger presses inside the timing window
  # before the system speeds up. The same adaptive.* knobs (target
  # band, bpm_min, bpm_max, bpm_step, weakness_bias) drive how the
  # pace evolves from here.
  start_bpm: 24

rhythm:
  difficulty: medium     # easy | medium | hard
  # Seconds after the visual countdown ends before the audio starts +
  # the first beat is due. Gives the falling-notes visualiser time to
  # ramp in so the patient sees notes sliding down before they need to
  # press one. The 3 s countdown ticking from "3" to "GO" still runs;
  # this is an ADDITIONAL silent ramp on top of it.
  pre_song_lead_s: 2.0
  beat_subset:           # which beats fire per difficulty
    easy: 4              # every 4th beat
    medium: 2            # every 2nd beat
    hard: 1              # every beat
  perfect_ms: 50
  great_ms: 100
  good_ms: 175
  miss_ms: 300
  # Audio-output latency compensation. pygame.mixer's buffer + the OS
  # audio path add ~20-50 ms between when our song_time clock thinks a
  # beat occurs and when the patient actually HEARS it. Without this
  # the patient's "on the beat" press lands as ~40 ms Late even when
  # they're perfectly in time. Default 40 ms is the typical pygame
  # latency on macOS / Windows; bump it up if presses still feel late,
  # or down toward 0 if they feel early.
  audio_offset_ms: 40

audio:
  enabled: true
  # master_volume scales the WHOLE game (music, cues, feedback). The two
  # levels below sit on top of it so the clinician can balance the press
  # cue against the confirmation chime without touching the overall level.
  # Final volume of a sound is master x category x trial_gain x a fixed
  # per-sound factor. All three are set from the Settings screen and
  # persist to user_settings.yaml.
  master_volume: 0.8
  # Pre-press cue level: the metronome click in classic / adaptive (the
  # "go" tick the patient hears before they press).
  cue_volume: 1.0
  # Post-press feedback level: the hit chime + miss thunk after a press.
  feedback_volume: 1.0
  music_dir: assets/music
  # Per-lane stim cue tone (C, E, G, C, repeating for bilateral) that
  # fires the moment a stim is dispatched in classic + adaptive modes.
  # Matches Aiden's game behaviour. Rhythm mode ignores this and plays
  # the song instead.
  stim_tone_enabled: true
  # Programmatic loudness variation. On a small fraction of trials,
  # spread evenly across the whole session (not random clusters), the
  # cue + feedback play slightly louder. This is automatic, not a manual
  # per-patient knob: it keeps the auditory cue salient so the patient
  # doesn't habituate to a constant level over a long training block.
  # fraction 0.10 = roughly 1 in 10 trials; boost 1.35 = 35% louder on
  # those trials. Set fraction to 0 to disable.
  loud_trial:
    fraction: 0.10
    boost: 1.35

ui:
  resolution: [1280, 800]
  # Boot fullscreen (kiosk-style clinical use). F10 toggles to a
  # windowed view at runtime. The render size stays 1280x800 either
  # way; the display opens with SCALED so it upscales to fit the monitor.
  fullscreen: true
  theme: clinical
  font_scale: 1.0

logging:
  level: INFO
  file: sessions/rehab.log

# Optional pretest / main / aftertest protocol. When `blocks` is a
# non-empty list, calling GameEngine.start_protocol() runs the
# blocks back-to-back with the named `phase` written into each
# trial CSV row's `phase` column. Useful for learning-effects
# studies where you want to compare baseline (pretest) and post-
# training (aftertest) on either side of a main training block.
#
# Default is empty so existing free-play flow is unaffected. To
# enable, override in user_settings.yaml or pass --config a YAML
# like:
#   protocol:
#     blocks:
#       - {mode: classic,  phase: pretest}
#       - {mode: adaptive, phase: main}
#       - {mode: classic,  phase: aftertest}
protocol:
  blocks: []
