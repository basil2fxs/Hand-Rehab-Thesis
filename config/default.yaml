# Default config. Override by passing --config path/to/your.yaml.

session:
  data_dir: sessions
  participant: null
  # Age captured on the title screen alongside the participant name.
  # Kept as a string so the JSON round-trips raw user input (e.g.
  # "65y" or "NA"). An empty value means "not provided".
  age: null
  # ---- participant details, set these before a participant session --
  # Recorded into metadata.json. They cannot be recovered afterwards,
  # and some analyses cannot run without them.
  #
  # affected_side matters most. Bilateral asymmetry is a signed number,
  # so pooling a cohort where some people are impaired on the left and
  # some on the right cancels the group mean toward zero and reads as
  # no asymmetry when it is actually large. Recording the side lets the
  # analysis flip the sign per participant.
  affected_side: null        # left | right | null when not applicable
  dominant_hand: null        # left | right
  # Impairment score at consent, e.g. "Fugl-Meyer UE 42/66". Free text
  # so the scale is recorded alongside the number. Needed to show the
  # cohort matches the moderate-impairment population the 65 to 80
  # percent challenge band was chosen for.
  impairment_score: null
  # Hand measurements in mm for the ANSUR II percentile check behind
  # the chassis sizing objective.
  hand_length_mm: null
  hand_breadth_mm: null
  # ---- intake fields the login screen collects ----------------------
  # Every one of these is typed or picked on the login screen and
  # lands in metadata.json; set them here only to pre-fill the screen
  # (a per-participant yaml passed as --config, say). The login value
  # always wins over the file.
  sex: null                  # female | male | other | null (not said)
  edinburgh_lq: null         # Edinburgh short-form LQ, -100 to 100
  visit: null                # visit number in a repeated study
  # Whether the login pre-fills the participant field with the next
  # free study code (P01, P02, ...) read off the sessions tree.
  #   auto    pre-fill once a coded participant exists on this machine,
  #           so a clinic install that only ever types names never
  #           sees a code it did not ask for
  #   always  pre-fill from P01 on an empty tree (a study laptop)
  #   never   leave the field blank
  # Typing over the suggestion replaces it, so a name is one keystroke
  # away either way.
  suggest_code: auto
  # Per-participant preferences (today: the menu music mute), keyed by
  # the same identity the session folders use. Kept apart from
  # user_settings.yaml because that file describes the machine and is
  # snapshotted into every session's metadata; a mute is one person's
  # choice and follows that person. Written by the app; see
  # finger_rehab/data/prefs.py.
  prefs_file: config/participant_prefs.json

report:
  # Build researcher outputs at the end of every block: report.html,
  # summary.csv and charts/ inside the session folder, plus one line
  # per block in sessions/sessions_index.csv. Needs matplotlib for the
  # charts; tables still generate without it. Set false to skip.
  enabled: true

serial:
  port: auto
  baud: 115200
  read_timeout_s: 0.02
  open_retries: 3
  open_retry_delay_s: 1.0
  # Explicit per-hand port assignments. When set, these override the
  # auto plug-order assignment (first detected = right, second = left).
  # Set from the Settings screen on the title page, persisted to
  # config/user_settings.yaml. null means "auto-pick". A saved port
  # the OS can no longer see is ignored at boot and that hand falls
  # back to plug order, because port names change between plug-ins
  # and a stale entry must not block the session.
  left_port: null
  right_port: null
  # Watch for boards being plugged in while the app is running. With
  # this on, an Arduino plugged in at the login screen, on the hub, on
  # Settings or between two games connects itself and takes the hand
  # the rules above give it, with no Refresh press. A board that
  # arrives mid-game waits for the game to end rather than swapping
  # the source out from under a running trial. Set false on a rig
  # where scanning the USB bus is unwelcome; the Settings screen's
  # Refresh button still works either way.
  autoconnect: true
  # Seconds between port scans. The scan runs on its own thread so the
  # frame never waits on it. A second reads as instant to a person and
  # costs nothing; values under 0.1 are clamped so a typo cannot turn
  # the watcher into a spin loop.
  autoconnect_poll_s: 1.0
  vendor_ids:
    - "0x2341"   # Arduino LLC
    - "0x239A"   # Adafruit
    - "0x10C4"   # SiLabs CP210x
    - "0x1A86"   # CH340
    - "0x0403"   # FTDI

eeg:
  # EEG trigger markers. When enabled, every event the analysis wants
  # to epoch on (stimulus onsets, presses, block boundaries, pauses)
  # is written to a trigger box on its own serial port as a single
  # byte, held for pulse_ms and then reset to 0. The code map lives in
  # rehab/hardware/eeg_trigger.py (CODES); every emission is also
  # logged as an "eeg" event row in raw.csv with the intended-event
  # and wire timestamps, on the same clock as the force samples.
  #
  # Shipping default is OFF: a normal rehab session has no amplifier
  # and pays nothing for this block existing. The lab preset
  # (config/eeg_lab.yaml, launched by "EEG Lab.command" or
  # "EEG Lab.bat") flips it on over these defaults.
  enabled: false
  # The trigger box's serial port, e.g. COM10 on the lab's Windows
  # desktop. This is a SECOND port, separate from the Arduino sensor
  # ports; null plus enabled true runs the logging-only dummy backend.
  port: null
  # Virtual COM trigger boxes ignore baud; real UARTs need it to match.
  # Never 1200: the NeuroSpec MMBT-S resets and drops off the bus at
  # that rate (its manual, section 3.3), so the writer refuses it. The
  # lab preset sets the box's documented 9600.
  baud: 115200
  # true (the lab preset): refuse to start without an openable trigger
  # box, so a lab session can never run silently unmarked. false: fall
  # back to the dummy backend and say so at startup, which is right
  # for development and demos.
  require_port: false
  # Marker pulse width and the enforced low time between markers, in
  # milliseconds, held on the wall clock, never by frame counting (the
  # old lab script counted frames and delivered 1-4 ms pulses). An
  # amplifier sampling 250 Hz needs at least 8 ms to guarantee two
  # samples of the pulse; 10 ms clears every plausible lab rate.
  # Confirm the amplifier model and rate with Welber and record both
  # in the thesis methods before changing these.
  pulse_ms: 10
  gap_ms: 10
  # Which trigger box and which of its modes the session ran with,
  # copied into metadata.json and otherwise unused. The lab preset
  # names the MMBT-S in Pulse Mode, where the box itself holds every
  # code 8 ms and ignores pulse_ms; null here because the shipping
  # game has no box.
  box: null
  box_mode: null
  # Feedback-onset markers (140 positive / 141 negative) for FRN
  # analyses. Off until an FRN analysis is actually planned; the
  # response and stimulus bands carry everything else regardless.
  feedback_markers: false

fsr:
  num_sensors_per_hand: 4
  sample_rate_hz: 200
  # Baseline tracker. This is an EMA per sample; at the device's 200 Hz
  # the time constant is 1 / (alpha * 200) seconds. It exists to absorb
  # slow thermal and mechanical drift, NOT to follow a press.
  #
  # This was 0.02 (a 0.25 s time constant), which is faster than a weak
  # or slow press builds. The baseline chased the press upward and the
  # signal never crossed the threshold, so a patient pressing gently
  # over a second or two registered nothing at all. At 0.0005 the
  # constant is about 10 s: drift is still absorbed, presses are not.
  baseline_alpha: 0.0005
  value_alpha: 0.35
  # PRESS THRESHOLDS, measured per finger on the real device.
  #
  # Detection is relative to each sensor's own live baseline, so these
  # travel with the hardware rather than needing a fresh calibration on
  # every machine. They are set from what a hand actually does on the
  # pads, not from how hard a healthy person can press, which is what
  # makes them usable by a weak finger.
  #
  # Resting noise on this device is about 1.1 counts SD per sensor.
  #
  # MEASURED against a resting hand with tools/calibrate_rest_vs_press.py
  # (29 July 2026). Counts are above the empty-device reading:
  #
  #   finger   resting hand   gentle press   usable gap
  #   index         +2.5          +51.5          49
  #   middle        +8.9          +40.9          32
  #   ring         +11.5          +41.5          30
  #   pinky        +30.7         +145.7         115
  #
  # The earlier uniform 12 was UNSAFE: the pinky pad carries +30.7 at
  # rest, so a hand merely resting on the device sat above the trigger
  # and fired phantom presses continuously. A threshold derived only
  # from an empty device cannot see that; it has to be measured with a
  # hand in the normal resting position.
  #
  # These are RELATIVE TO THE TRACKED BASELINE, which already sits at
  # the resting level. So a trigger only has to cover the gap between
  # resting and pressing, not the absolute load on the pad.
  #
  # An earlier set added the resting load on top of a fraction of the
  # gap, which counted that load twice: the baseline had already
  # absorbed it. The pinky suffered worst, ending up needing 67% of its
  # available gap against 45% for the index, and 6.77 N in absolute
  # terms. That is above the 5.60 N maximum Demouche recorded for a
  # HEALTHY little finger, so the trigger was out of reach of the
  # patients the device is for.
  #
  # Each trigger is now 40% of that finger's gap, with a floor of
  # (resting load + 3 SD of noise). The floor only matters in one case:
  # if a block starts with the hand off the device, the baseline
  # initialises to the empty reading, and the hand landing looks like a
  # rise. The floor keeps that below the trigger. It binds on the ring
  # finger only, and it does NOT inflate the pinky, whose 40%-of-gap
  # value already clears its resting load comfortably.
  #
  #   finger   gap   trigger   % of gap   force
  #   index     49      20        40%     1.72 N
  #   middle    32      13        40%     1.13 N
  #   ring      30      15        49%     1.30 N
  #   pinky    115      46        40%     4.04 N
  #
  # HONEST LIMIT on the pinky. 4.04 N is a real improvement on 6.77 N
  # and is now under Demouche's healthy maximum, but it is still above
  # the 2.66 N healthy MEAN. The pinky pad reads 115 counts for a press
  # described as gentle, three to four times the other fingers, which
  # is a pad placement problem rather than a patient problem. Two things
  # fix it properly: reduce the resting load on that pad in hardware, or
  # run the in-app calibration with the actual patient, which sets every
  # trigger from THEIR light press instead of from these figures.
  #
  # Anything measured by the in-app calibration overrides these. Treat
  # them as the starting point for an uncalibrated device.
  #
  # RELEASE VALUES ARE CAPPED BY THE DETECTOR, so they are written here
  # already capped rather than being silently rewritten at runtime.
  # FSRDetector computes off_thr = min(base + off_delta, on_thr - 10). If
  # on_delta were ever under 10 that lands BELOW the baseline, and a finger
  # that has registered one press could then only release by lifting off the
  # device: it stays latched and every later trial on it scores a miss, which
  # looks like a paralysed finger rather than a threshold fault. Keeping
  # on_delta above 12 and off_delta at or under (on_delta - 10) makes the
  # release point always sit above a resting hand.
  on_delta: [20, 13, 15, 46]
  off_delta: [10, 3, 5, 23]
  # Absolute floors are a broken-sensor guard, not part of normal
  # detection. Real baselines sit at 235-260, so 150 never binds during
  # a session; it only stops a sensor whose reading has collapsed to 0
  # (an I2C fault, which the firmware reports as 0) from registering
  # phantom presses. abs_off_max is set high so it never clips release.
  abs_on_min: [150, 150, 150, 150]
  abs_off_max: [1000, 1000, 1000, 1000]
  debounce_ms: 100

quick_cal:
  # The gamified calibration that runs when a session starts, over
  # every hand the attached boards can serve, and again for a board
  # plugged in later in the session. It collects the same empty /
  # resting / light-press captures as the menu calibration and saves
  # through the same CalibrationProfile path; these knobs only shape
  # the game around that collection. Keyboard sessions never see it
  # (no force to calibrate). Set false to turn the automatic pass off
  # entirely; the hub's Calibrate button still works.
  enabled: true
  # Seconds each rest capture runs (hands off, then hands resting).
  # Shorter than the menu flow's 3 s because the player is watched
  # through it live; long enough to average the sensor noise.
  rest_capture_s: 2.0
  # Seconds a press must sit inside the target band to count. The held
  # plateau is what the light-press level is read from, so shortening
  # this below ~0.5 s starts sampling the rise instead of the hold.
  hold_s: 1.0
  # There is deliberately no target-band setting here. The band the
  # screen coaches against comes from calibration_profile.target_gap_band,
  # built out of the same constants the thresholds are computed from and
  # fed with the run's own empty and resting captures, so it moves per
  # finger with how loaded that pad is. A band set here could ask for a
  # press the threshold maths then rejects, which is the one failure the
  # screen exists to remove.

cue:
  # WHAT THE PATIENT GETS ON A TRIAL, as four switches that are each
  # on or off on their own.
  #
  # Two moments matter. BEFORE the press, something has to tell the
  # patient which finger to move. AFTER a correct press, something can
  # confirm the press landed. Each moment has a buzzer channel and a
  # sound channel, giving the four keys below. All 16 combinations are
  # valid, including all off, and every mode (classic, adaptive,
  # rhythm, mirror) honours whatever is set.
  #
  # This is the comparison the whole project line started from. Palmer
  # (2024) found reaction time differed between an LED-only cue and all
  # cues together, and the 2023 device existed to test exactly that.
  # Splitting the cue into separate channels is what lets a block
  # isolate one of them.
  #
  # Replaces the older game_cue.mode (both / visual / vibration) plus
  # motor.enabled pair. A user_settings.yaml written by that build is
  # translated onto these keys at load, so an existing setup keeps
  # behaving the same until these are set explicitly. See
  # apply_cue_migration in rehab/config.py.
  #
  # Recorded per trial in the cue_flags column so blocks run under
  # different settings can be pooled and split again in the analysis.
  # Changed from the Sensory Cues menu on the Settings screen.
  #
  # With buzz_before and sound_before shipped on, every timed mode is
  # measuring the response to an audio-tactile-visual cue, not a
  # visual one. Auditory and tactile reaction times run faster than
  # visual, so the channel mix changes what the number means, not
  # just its noise. Keep the mix constant within any comparison,
  # split on cue_flags when pooling blocks, and turn channels off
  # here for a block that needs a single-channel measure such as the
  # reaction brief's screen-only visual RT.

  # Buzzer under the TARGET finger fires when that trial's stimulus
  # fires, so the patient feels which finger to press rather than only
  # reading it off the screen. In mirror mode both target fingers buzz
  # together. Buzz length is motor.cue_ms.
  buzz_before: true

  # Cue tone plays when the stimulus fires, so the patient hears the go
  # signal. One tone per stimulus (the lowest target lane in mirror
  # mode, so two fingers do not stack two tones onto one beat).
  #
  # In rhythm mode the tone plays on every note, over the music, which
  # marks the beat the patient has to hit. Turn it off for rhythm
  # blocks where the song alone should carry the beat.
  sound_before: true

  # Confirmation chime after a CORRECT press, meaning the patient
  # pressed the cued finger inside the response window. Nothing plays
  # on a timeout, and nothing plays on a wrong finger.
  #
  # This switch owns the whole post-press sound channel, so turning it
  # off also silences the low thunk that plays when a miss breaks a
  # streak. Leaving the thunk on would still feed the patient
  # information through the ears after a press, which is the thing
  # this key exists to be able to remove.
  #
  # Off by default, which is a change from the build before these
  # toggles: that one chimed on every correct press with no way to
  # stop it. There is no legacy key to migrate from, so an existing
  # user_settings.yaml will not carry the chime over. Turn it on for
  # blocks where the patient should hear that the press landed.
  sound_after: false

  # Buzzer fires on the finger that was just pressed correctly, for
  # motor.cue_ms. Same rule as sound_after: correct press only, never
  # on a timeout or a wrong finger. In mirror mode both pressed
  # fingers buzz.
  #
  # Off by default, and new in this build so an older
  # user_settings.yaml has nothing to translate from either way. A
  # confirmation buzz on every correct press gets wearing over a
  # forty-trial block, and the reaction-time comparison does not need
  # it: what matters there is what the patient got BEFORE they moved.
  # Turn it on when the point is to reinforce a correct press rather
  # than to measure the response to a cue.
  #
  # One thing to watch once it is on: adaptive can reach 180 BPM,
  # which is 333 ms between stimuli, so a confirmation buzz of any
  # length runs straight into the next trial's cue buzz at the top of
  # the range. Shorten motor.cue_ms or turn this back off if the two
  # start to blur together.
  buzz_after: false

  # SCREEN REVEAL. Not one of the four switches: this is whether the
  # gameplay screen highlights the target finger, and it is kept
  # separate because the screen is always there whether or not any cue
  # channel is on.
  #
  # Off is the interesting condition for a thesis. The tile stays
  # neutral and the finger has to be found from the buzzer alone,
  # which isolates the tactile channel. It is the harder condition, so
  # expect a lower hit rate and a longer reaction time. The timing bar
  # still runs either way so the patient can see how long is left.
  #
  # Off together with buzz_before off leaves nothing at all saying
  # WHICH finger to press, only that a trial has started. The software
  # allows it; the trials will read as misses.
  show_target: true

motor:
  # How long the buzzer runs, in milliseconds. Used by both the
  # pre-press cue (cue.buzz_before) and the post-press confirmation
  # (cue.buzz_after), so the two feel like the same signal.
  #
  # The firmware drives the motor at a FIXED
  # strength: STIM_PWM = 200 is a compile-time constant and the only
  # commands it accepts are "STIM:n" and "STOP". Vibration amplitude
  # therefore cannot be changed from the host at all. What we can
  # change is duration: each STIM re-arms the motor for another 150 ms,
  # so the engine repeats pulses to hold it on for longer. That is what
  # this setting and the Settings slider control, and it is what makes
  # a cue feel stronger or gentler in practice.
  #
  # Default 250 ms, chosen from the vibrotactile literature rather
  # than from what the firmware happens to do in one pulse:
  #
  #  - About 30 ms is the minimum duration for a vibrotactile stimulus
  #    to be perceived as a vibration rather than a single pulse
  #    (Vibrotactile stimulus duration threshold, PMC11814341). 250 ms
  #    sits roughly 8x above that floor, so perception is not marginal.
  #  - Vibrotactile cueing studies use burst durations across roughly
  #    25-400 ms, so 250 ms is mid-range and not an outlier.
  #  - Cutaneous sensation is impaired in about a third of stroke
  #    patients and is 40-84% worse on the more-affected side
  #    (PMC4133225), and roughly 40% greater stimulation is needed for
  #    initial perception on the paretic hand (PMC12742966).
  #
  # That last point is the deciding one. The usual way to compensate
  # for a raised perception threshold is more intensity, but this
  # firmware fixes drive strength at STIM_PWM = 200 and exposes no way
  # to change it. Duration is the only compensating lever available,
  # so the default is set longer than a single 150 ms pulse to give a
  # patient with reduced sensation a cue they can actually feel.
  #
  # Range worth staying inside: 150 ms (one pulse, healthy sensation)
  # up to about 400 ms (upper end of the tested range; beyond this the
  # cue starts running into the patient's own response).
  # tools/calibrate_buzzers.py sets this per device and also checks
  # each motor is wired to the finger the software thinks it is.
  cue_ms: 250
  # Gap between repeat pulses when cue_ms asks for more than one. Must
  # stay under the firmware's 150 ms hold or the motor stutters
  # instead of running continuously.
  pulse_interval_ms: 120
  # Silence between the pulses of a multi-finger cue (chords mode).
  # The four motors on a board share one driver, so a chord cannot
  # buzz all its fingers at once; the cue is an arpeggio instead, one
  # 150 ms firmware pulse per finger, always index to pinky. This gap
  # sits between pulses so each finger's buzz reads as its own rather
  # than one long buzz sliding across the hand. At 40 ms a four-finger
  # cue spans about 720 ms. Raising it makes the fingers easier to
  # tell apart and the cue slower; do not go below about 20 ms or the
  # pulses start to blur together.
  arpeggio_gap_ms: 40
  # PER-FINGER BUZZ LENGTH, one entry per finger in the order
  # index, middle, ring, pinky. Empty falls back to cue_ms for all four,
  # which is what ships and what should normally be used.
  #
  # LEAVE THIS EMPTY unless you have a reason. Every finger gets the same
  # cue length on purpose. A longer buzz is a different stimulus, and the
  # analysis compares reaction time BETWEEN fingers, so a finger cued for
  # longer than its neighbours would look different for a reason that has
  # nothing to do with the patient.
  #
  # The pinky motor being weaker is handled where it belongs, in the
  # firmware: MOTOR_PINKY_PWM is 240 against 200 for the other three, in
  # arduino/firmware_on_device/lib/Config/Config.cpp. If it still feels
  # faint, raise that and reflash rather than stretching the cue here.
  #
  # Clamped to 80% of game.trigger_interval_s if set, so a long cue
  # cannot still be running when the next trial starts.
  cue_ms_per_finger: []
  # WHICH STIM CHANNEL DRIVES WHICH FINGER.
  #
  # The firmware maps STIM:1..4 onto its motor pins in a fixed order,
  # so if a motor is wired to a different pin than that order assumes,
  # the wrong finger buzzes. Rather than touch the sketch, the host
  # sends whichever channel actually reaches the finger it means.
  #
  # The firmware now on the device (arduino/firmware_on_device) drives
  # index D11, middle D10, ring D9, pinky D6, and its motorPins array is
  # in finger order, so straight through is correct for it. The earlier
  # handover sketch drove D3 to D6 instead, which is why nothing buzzed
  # on this wiring: only the pinky pin overlapped.
  #
  # Read this as: to buzz the INDEX finger send STIM:<first entry>,
  # for MIDDLE send STIM:<second>, and so on. The default 1,2,3,4 is
  # the straight-through case where the wiring matches the sketch.
  #
  # Discover the real mapping with tools/calibrate_buzzers.py, which
  # buzzes each channel and asks which finger you felt. It writes the
  # result here so the game uses it from then on.
  channel_map: [1, 2, 3, 4]

bilateral:
  hand: right            # right | left | both
  per_hand_calibration: true

game:
  # EQUAL PRACTICE PER FINGER.
  #
  # Every cross-finger comparison in the analysis assumes each finger got a
  # comparable number of attempts. A finger cued half as often has an average
  # built from half the samples, so a difference between fingers ends up
  # reporting how often each was asked rather than anything about the hand.
  #
  # With this on, classic, rhythm and bilateral give every finger the same
  # number of cues, and bilateral gives both hands the same number too. The
  # order stays unpredictable: a fixed order lets the patient anticipate the
  # cue, which turns a reaction time into a measure of rhythm.
  #
  # Adaptive is different. It deliberately gives a struggling finger more
  # practice, which is the point of the mode, so it keeps its weighting and
  # only puts a floor under each finger (see adaptive.min_finger_share).
  #
  # Turn this off to go back to the old fixed pattern from game.pattern.
  balance_targets: true
  mode: adaptive         # reaction | classic | adaptive | rhythm | mirror
  # Classic-mode pacing. 1.2 s between stim onsets + 1.0 s timeout means the
  # patient has up to ~2.2 s per trial, which is comfortable starting pace
  # for most patients. Adaptive mode ignores trigger_interval_s and
  # drives cadence from the engine's BPM instead.
  trigger_interval_s: 1.2
  timeout_s: 1.0
  early_window_s: 0.1
  total_trials: 40
  # Pre-start "GET READY" countdown (seconds): the ONE prep every mode
  # runs between pressing start and the game beginning. Gameplay-screen
  # modes and syllables show the same card; rhythm welds the same
  # seconds to the front of its note-fall timeline. Research gating
  # rides inside it rather than stacking on it (chords accumulates its
  # baseline-quiet clock during the card). Test mode trims it to keep
  # quick demos quick.
  start_countdown_s: 3.0
  # Every enforced wait in every mode can be cut short with Space or
  # by clicking the skip control (see finger_rehab/game/rest_skip.py).
  # Waits shorter than this never draw the control: a button that
  # appears for two seconds cannot be read, let alone aimed at, and
  # one flashing between every trial of a perception or reaction block
  # would be a moving distraction next to the thing being measured.
  # The keyboard skip still works on the short ones. 2.5 is where the
  # per-trial gaps and the sit-through waits actually separate at
  # these settings; the mode-by-mode split is written out in
  # rest_skip.py. Every skip is counted in the block summary and
  # written to raw.csv, and a skip that shortens a wait protecting a
  # measurement also flags the trial it released.
  skip_chip_min_s: 2.5
  # Test Mode is a supervisor-demo shortcut. When enabled, every block
  # (classic / adaptive / rhythm) is capped at test_mode_trials trials
  # so the full pipeline (mode select -> setup -> gameplay -> results)
  # fits inside a 60-second demo. Rhythm mode trims the beatmap to the
  # first N notes; the audio still plays the full track. Researcher
  # runs should keep test_mode_enabled=false so the trial CSVs hold the
  # normal 40-48-trial blocks. Toggleable from the Settings screen.
  test_mode_enabled: false
  test_mode_trials: 6
  # Unilateral RIGHT-hand keymap. Patient rests their right hand on the
  # home row so j (index finger, closest to centre) is lane 0 and ; (little
  # finger, outer edge) is lane 3. Lanes always go 0=index..3=little.
  keyboard_map:
    j: 0           # right index
    k: 1           # right middle
    l: 2           # right ring
    semicolon: 3   # right little
  # Unilateral LEFT-hand keymap. Patient rests their left hand on the home
  # row so f (index, closest to centre) is lane 0 and a (little, outer
  # edge) is lane 3. Same lane convention as right so the rest of the game
  # logic doesn't care which hand.
  keyboard_map_left:
    f: 0           # left index
    d: 1           # left middle
    s: 2           # left ring
    a: 3           # left little
  # Bilateral keymap (both hands). Lanes 0..3 = right hand, 4..7 = left.
  keyboard_map_bilateral:
    j: 0           # right index
    k: 1           # right middle
    l: 2           # right ring
    semicolon: 3   # right little
    f: 4           # left index
    d: 5           # left middle
    s: 6           # left ring
    a: 7           # left little

adaptive:
  # Smallest share of a block any single finger is guaranteed, whatever the
  # weighting says. Adaptive mode is meant to give a struggling finger extra
  # practice, so this is a floor rather than a flattening: the weak finger is
  # still cued most, but no finger is starved to the point where its trials
  # cannot support an average.
  #
  # Without it, a 60-trial block with one weak finger left the strongest with
  # about 3 trials, roughly 5%. At 0.15 the same block gives roughly
  # 9/11/16/24 with the weak finger still on top, and only about 4 of the 60
  # picks are forced by the floor, so the weighting still drives the rest.
  #
  # Capped internally at 1/num_lanes (0.25 for one hand), which would be
  # exact balance. Set 0 to restore the old unfloored behaviour.
  min_finger_share: 0.15
  # Start slow so the patient gets confident hits before the system
  # speeds up. Lowered from 60 -> 30 BPM = 2.0 s between stimuli.
  # 60 BPM (1.0 s) was opening the first block above the comfortable
  # press cadence for stroke-rehab patients, which pushed hit-rate
  # below the 65-80% challenge-point band and bounced the engine
  # straight into recovery. From 30 BPM the patient can string a
  # streak together; the engine bumps up by bpm_step every time it
  # sees a sustained hit rate above target_high.
  start_bpm: 30
  bpm_min: 10                 # crawl mode for severe weakness (6s gap)
  # Raised from 140 with the band-keeping fix. The cap is set by the
  # band, not by taste: for a hand with a fast 280 ms press the hit
  # rate only falls back into the 65-80% band once the press window
  # shrinks near 300 ms, which is 180 BPM (window = cadence * 0.90).
  # At 140 (window 386 ms) that hand sat at 100% hits for whole
  # sessions, measurably outside the band the controller exists to
  # hold. Measured on a headless 280 ms simulated player: at 140 the
  # trailing hit rate never re-entered the band in 300 trials; at 180
  # it settled back inside it around trial 53 (about half a minute).
  bpm_max: 180
  bpm_step: 10                # base step. Scaled up when hit rate is far off.
  target_low: 0.65            # aim for the 65-80% band around the 70% target
  target_high: 0.80
  weakness_bias: 2.5
  min_trials: 2               # react after just two trials, not eight
  block_size: 4               # regenerate the sequence + reweight every 4 trials
  # Timeout scales with cadence so a slow pace gives more time to press.
  # timeout_s = cadence * timeout_factor.
  timeout_factor: 0.90

scoring:
  # Reaction-time bands for classic + adaptive trials. The patient's
  # press is timed from the stim firing; the band determines both the
  # outcome label shown on screen and the points awarded.
  #
  #   RT  <= perfect_ms  -> "Perfect"  +perfect_points
  #   RT  <= great_ms    -> "Great"    +great_points
  #   RT  <= good_ms     -> "Good"     +good_points
  #   RT  >  good_ms     -> "Late"     +late_points
  #   no press           -> "Miss"     +miss_points
  #
  # The 10/6/3/1 spread is intentionally wider than the historical
  # 3/2/1 - that earlier scheme made the difference between a 150 ms
  # press and a 600 ms press only +2 points, which on a single trial
  # was invisible. Now a Perfect is worth 10x a Late so the patient
  # FEELS the variance in real time.
  perfect_ms: 100
  perfect_points: 10
  great_ms: 200
  great_points: 6
  good_ms: 500
  good_points: 3
  late_points: 1
  # Missed trials + early presses default to 0 (score still won't go
  # below zero, the floor is enforced in engine._apply_wrong_penalty).
  miss_points: 0
  early_penalty: 0
  # Wrong-finger press penalty. Subtracts this many points on EVERY
  # wrong-finger press during a trial (classic + adaptive) and on
  # every unmatched press in rhythm mode. Tuned against the wider
  # point spread above: at penalty=3, mashing 3 wrong fingers costs
  # -9, which overwhelms even a great hit (+6). A Perfect (+10) can
  # still net positive with one wrong (+1), but a focused Perfect
  # (+10) always beats the spam outcome - so the dominant strategy
  # is "press one finger fast", not "mash everything". Floored at
  # score=0 so the display never goes negative. Set to 0 to disable.
  wrong_press_penalty: 3
  # Idle-press penalty. Subtracts this many points per press that
  # lands in classic / adaptive while NO trial is active (between
  # stims). Without it, mashing between trials cost nothing because
  # the press handler short-circuited. Detector debounce_ms already
  # rate-limits the spam at the hardware layer, so this just makes
  # each accepted between-trial press cost something. Smaller than
  # wrong_press_penalty (1 vs 3) because a legitimate finger fidget
  # shouldn't punish as hard as actively pressing the wrong key
  # during a trial. Set to 0 to disable.
  idle_press_penalty: 1

metrics:
  # Miss-force window. For every trial the engine tracks each finger's
  # peak reading (minus baseline) over this many milliseconds after the
  # go stimulus. On a MISSED trial it sums that peak across all fingers
  # and accumulates it, so the results screen can report how much total
  # force the patient was applying across the whole hand when they failed
  # the trial. Units are raw sensor counts (no newton calibration is
  # configured), and the value reads 0 in keyboard mode (no FSRs).
  miss_force_window_ms: 1000

mirror:
  # Bilateral coordination is harder than unimanual cued press so
  # mirror opens slower than adaptive (which starts at 30). Patient
  # needs to land both same-finger presses inside the timing window
  # before the system speeds up. The same adaptive.* knobs (target
  # band, bpm_min, bpm_max, bpm_step, weakness_bias) drive how the
  # pace evolves from here.
  start_bpm: 24
  # Fixed-ms bound on |right press - left press|. The press window
  # above is BPM-derived and widens with a struggling patient, so it
  # cannot by itself enforce synchronous movement; this fixed gate is
  # what actually does. A pair further apart than this downgrades to
  # a Miss even if both landed inside the window.
  max_async_ms: 350

reaction:
  # Reaction mode: a randomised wait, then press as fast as you can.
  # The baseline block that replaced Classic, so these numbers decide
  # what every cross-session comparison is made of. The research case
  # for each value lives in rehab/game/modes/reaction.py; this file
  # explains what the patient experiences.

  # choice = any of the four fingers can be cued (all fingers get equal
  # counts, order unpredictable). simple = one designated finger every
  # trial, the cleanest eye-to-hand measure. The two are different
  # measures, not difficulty levels: choice adds picking the right
  # finger on top of reacting, and runs roughly double the RT.
  sub_mode: choice
  # Which finger simple mode uses, 1=index .. 4=little. Index by
  # default because it is usually the strongest and least impaired, so
  # the first simple blocks measure reacting, not struggling to press.
  srt_finger: 1

  # A block is this many scorable trials (a press or a timeout). False
  # starts, wrong fingers in simple mode and catch trials do not use
  # up scorable slots; attempt_cap ends the block anyway so a rough
  # day cannot trap the patient in an endless block. 25 trials runs
  # about 3 minutes, matching the validated short-form vigilance test
  # and stopping before time-on-task fatigue sets in.
  block_trials: 25
  attempt_cap: 35

  # The wait before the go signal. Drawn fresh every trial: fp_min_s
  # plus an exponential extra averaging fp_mean_extra_s, redrawn if
  # the total lands past fp_max_s. Exponential is the point, not a
  # detail: it keeps the chance of "go arriving right now" constant
  # however long the patient has waited, so watching the clock does
  # not help and the press stays a reaction. Typical waits run 2-4 s.
  # fp_mode uniform swaps in a flat 2-10 s draw for blocks meant to
  # be compared against published PVT numbers.
  fp_min_s: 1.5
  fp_mean_extra_s: 2.5
  fp_max_s: 9.0
  fp_mode: exponential
  # EEG variant: set a number (e.g. 2.5) for a CONSTANT wait plus a
  # visible "Ready" cue at its onset, replacing the exponential draw.
  # The exponential keeps the hazard flat on purpose, and a flat
  # hazard suppresses exactly the expectancy ramp the CNV analysis
  # measures, so EEG reaction blocks need the predictable wait. Set in
  # config/eeg_lab.yaml; null keeps the shipped behaviour everywhere
  # else. Do not compare RTs across the two variants: a predictable
  # wait changes what the number means.
  fp_eeg_fixed_s: null

  # On this fraction of trials no go signal ever comes. Waiting it out
  # earns a small reward; pressing anyway is a false start. This is
  # what makes guessing a losing game rather than a free bet. Kept at
  # 10 percent because more catches inflate everyone's RT and start to
  # feel like the game is cheating.
  catch_rate: 0.10
  catch_wait_s: 8.0

  # A press under this many ms after the go signal cannot be a real
  # reaction to it (the eye-to-hand loop is not that fast), so it is
  # scored as a false start, never as a hit. Feedback for every kind
  # of false start stays gentle on purpose: stroke can impair the
  # ability to hold a response back, and punishing that invites
  # pressing harder out of stress.
  anticipation_cut_ms: 100
  # A press at or past this many ms counts as a lapse (pressed, but
  # attention had wandered). Drives level progression, not the score.
  lapse_ms: 500

  # How long the patient has to press, by level. Levels move on
  # lapse-or-miss rate: two consecutive blocks under
  # level_up_lapse_rate tighten the window one step, one block over
  # level_down_lapse_rate widens it back. The window is the ONLY
  # difficulty lever; the press threshold never changes, because a
  # harder press would change what is being measured. Progress resets
  # to level 1 when the app restarts, the safe direction to fail.
  response_windows_s: [2.0, 1.5, 1.2]
  level_up_lapse_rate: 0.10
  level_down_lapse_rate: 0.30

  # The wait only starts once every finger has rested for this long,
  # so a slow release from the last press cannot leak into the next
  # trial as a phantom false start.
  rest_gate_s: 0.3
  # How long the millisecond result stays on screen after a press,
  # how long the "Too soon" notice stays after a false start, and the
  # blank gap before the next trial arms. Together they set the cycle
  # at roughly 6 s per trial.
  feedback_s: 1.2
  false_start_feedback_s: 1.5
  inter_trial_gap_s: 0.5

  # Set an integer to replay a block's exact wait sequence (testing,
  # or a deliberately repeated protocol). Empty draws a fresh seed per
  # block and records it in raw.csv and the block summary, so any
  # block can still be reproduced afterwards.
  seed: null

pattern:
  # Patterns mode: the patient records "takes" of a piano riff, one
  # key lighting at a time, press it and the next follows half a
  # second later. Hidden inside most takes is a repeating sequence: 12
  # notes over one hand's four fingers, or 24 notes over all EIGHT
  # fingers when Both hands is selected, with the hands cued equally
  # every loop. Two takes per session secretly switch to unfamiliar
  # material, and how much the patient slows down on those is the
  # measurement. The research case for every number lives in
  # rehab/game/modes/pattern.py; this file says what the patient
  # experiences. One thing is non-negotiable at the bench: never tell
  # the patient a pattern exists. Knowing about it makes the learning
  # worse after stroke, not better.

  # A take is 5 loops of the 12-note sequence = 60 presses, roughly a
  # minute. Ten takes plus the warm-up run 12 to 25 minutes depending
  # on the patient's pace. With Both hands the loops are twice as
  # long, so the mode halves this (5 -> 3 loops of 24 = 72 presses)
  # to keep takes near the same length.
  soc_cycles_per_block: 5
  # Settling-in presses before the first take. Not analysed; they let
  # the hand find the keys and surface any calibration problem before
  # data that matters.
  warmup_trials: 20
  # Take 1 is mixed-up material every session: it tracks how fast the
  # patient is in general, so later sessions can tell "faster overall"
  # apart from "knows the riff". A multiple of 8 so the shuffle-bag
  # balances both hands exactly in bimanual play, not just the 4-lane
  # unilateral case; changing this away from a multiple of 8 still
  # runs, but bimanual hand balance is then only within one trial.
  random_block_trials: 64
  # How many unfamiliar sequences the patient's pool holds. Which two
  # a session uses rotates block to block so none of them gets
  # familiar. Some participants' material only admits 3; the pool
  # then holds 3.
  probe_pool_size: 4
  # Gap between the patient's press and the next key lighting. Fixed
  # on purpose: the rhythm of the game must never change for a
  # participant, or their speed changes for reasons that have nothing
  # to do with learning.
  rsi_ms: 500
  # How long a key stays lit waiting for its press. 2000 suits most
  # patients; raise to 3000 for slower stroke-affected hands. Set it
  # once per participant and leave it.
  timeout_ms: 2000
  # An 8-take session for patients whose stamina will not carry ten.
  # Both hidden-switch takes keep a familiar take on each side, which
  # the scoring needs. The short session skips the long mid-session
  # rest: in eight takes there is no spot where the extra rest cannot
  # lean on the scoring, so every break uses the same floor.
  short_session: false
  # Rests between takes: the patient advances with any press once the
  # floor has passed. Rest length does not change the learning
  # (varied 15 s / 30 s / self-paced in a 268-person study with no
  # difference), so the floor is for recovery and comfort. The longer
  # rest lands after the sixth take, mid-session, where the fresh
  # burst of speed a rest hands the next take cannot touch the takes
  # the scoring compares. A patient who wants more rest simply waits:
  # the floor is a minimum, never a push.
  rest_min_s: 10
  long_rest_s: 30
  # Five lit keys in a row with no press at all reads as a tired hand:
  # the game inserts a proper rest, longer than the between-take floor
  # because its job is recovery. A second such run ends the session
  # gracefully with the data kept. Slowing on the hidden-switch takes
  # never counts toward this.
  fatigue_timeout_run: 5
  fatigue_rest_s: 45
  # Whole-session ceiling. The session ends politely at the next press
  # after this many minutes, however far it got.
  session_cap_min: 30
  # Set an integer to replay a block's exact random material and
  # probe rotation (testing, or a deliberately repeated protocol).
  # Empty draws fresh each block and records it in raw.csv and the
  # block summary. The riff itself is NOT affected: that comes from
  # the participant name so it is the same every session.
  seed: null

chords:
  # Chords mode: two, three or four fingers pressed together, and the
  # fingers that were NOT asked are scored on staying still. Single
  # fingers never appear: every trial is a chord, the sizes are dealt
  # evenly and shuffled, no combination repeats twice running, and
  # every finger gets a fair share of work. The research case for
  # every number lives in rehab/game/modes/chords.py; this file says
  # what the patient experiences. One engine block is a whole
  # session: five rounds of chords with proper rests. With Both hands
  # selected the hands take turns on within-hand chords with equal
  # counts, and the third and fifth rounds ask for chords that SPAN
  # the hands (one or two fingers per hand), so both hands play the
  # whole session and the session also measures how well the hands
  # work together. Light presses only, everywhere: the game never
  # rewards pressing harder, and pressing much harder than the
  # calibrated light press earns a "press lighter" prompt.

  # How long the fingers have to land the chord once it lights up.
  # Generous on purpose: a slow chord still teaches the shape, and the
  # togetherness score is about the gap BETWEEN the fingers, not about
  # answering fast.
  timeout_s: 3.0
  # How close together the finger presses must land to count as "one
  # chord", in milliseconds, from easiest to hardest. The game starts
  # at the first value and only tightens when the patient is landing
  # 8 of their last 10 cleanly; it loosens again the same way. The
  # last value is the floor. Concert pianists land chords within about
  # 30 ms, so even the floor here stays three times softer than that.
  sync_windows_ms: [250, 200, 150, 100]
  # Once the chord is together, all its fingers stay down this long.
  # A ring fills on the held tiles while it runs, so the patient
  # watches the hold complete rather than being told about it after
  # the trial is over; a finger that lifts early is named on screen.
  # Kept short on purpose: holding a press makes the unwanted leak
  # onto other fingers grow, which is the opposite of the training
  # goal. Needs the sensors; the keyboard fallback skips the hold.
  hold_ms: 200
  # The hand must be properly at rest for this long before each chord
  # fires, so every trial starts from a still hand and the leak
  # measurement means what it says. If the hand will not settle the
  # screen asks the patient to relax it rather than firing anyway.
  baseline_quiet_ms: 500
  settle_prompt_s: 5.0
  # Breathing room between trials, drawn fresh each time so the next
  # chord cannot be timed rather than reacted to.
  iti_min_s: 1.5
  iti_max_s: 2.5
  # Session shape: rounds of chords, with a floor on the rest between
  # rounds (the patient presses any finger to continue once the floor
  # has passed). 5 rounds of 20 is about 100 chords, which lands the
  # session on the feasible-dose benchmark for stroke without
  # overstaying it.
  trials_per_subblock: 20
  subblocks: 5
  rest_between_s: 30
  # There are no single-finger warm-up presses any more: the whole
  # session is chords, and the per-finger reference the leak numbers
  # divide by comes from the quick calibration at login (the light
  # press each finger demonstrated there).
  # If a round goes clearly worse than the session's first round (hit
  # rate down 30 points, or presses 30 percent slower), the game
  # inserts this longer rest and eases the difficulty one step. A
  # second such round ends the session politely with the data kept:
  # a tired hand trains the wrong thing.
  fatigue_rest_s: 120
  # Whole-session ceiling. The session ends politely at the next trial
  # close after this many minutes, however far it got.
  session_cap_min: 30
  # Set an integer to replay a block's exact chord order and timing
  # jitter (testing, or a deliberately repeated protocol). Empty draws
  # fresh each block and records it in raw.csv.
  seed: null

syllables:
  # Syllable Beats: a children's mode, unlike everything else in this
  # file. A word appears as big blocks, one block per beat; the blocks
  # light left to right while the matching finger buzzes and a tone
  # plays, then the child taps the beats back on the sensors. Taps
  # always walk left to right like the blocks, on either hand: the
  # right hand starts at the index, the left hand ends on it. The
  # word sits on a window of side-by-side fingers that slides from
  # word to word, so every finger of the chosen hand(s) takes a turn
  # within a block and the blocks themselves show which fingers play.
  # With both hands connected the window ranges over all eight
  # fingers and can run off one hand onto the other (words of 5 to 8
  # beats always do); the taps still walk left to right, handing over
  # from one hand to the other once, never alternating. Long words
  # only exist with both hands connected, at band C for the longest
  # ones; one hand always keeps the full game. The research case for
  # every number lives in finger_rehab/game/modes/syllables.py; this
  # block says what the child experiences. Two cautions carried from
  # that file: this trains sound skills in the game only, it is NOT a
  # dyslexia treatment or test and must never be described to a
  # family as one; and the hardware was scoped for adult
  # rehabilitation, so using it with a child needs its own ethics
  # approval, a check that small fingers reach the pads, and cleaning
  # between children.

  # Which rung of the ladder this child is on. 1 counts beats with any
  # fingers, 2 maps beats onto fingers in order, 3 taps them in time
  # with the tick, 4 adds pressing the strong beat harder, 5 splits
  # short words into first-sound and rest, 6 taps single sounds. Move
  # it up only after two good sessions in a row at the top band; the
  # app keeps no history between sessions on purpose, so this stays a
  # researcher decision.
  level: 1
  # Word difficulty the block starts at: A everyday words, B less
  # common, C rare and long ones. Moves on its own during a block
  # (8 of the last 10 right goes up, under 5 of 10 comes down) and
  # every move is recorded.
  band: A
  # Milliseconds between beats. 500 is two beats a second, the pace
  # children this age tap most naturally and the pace the research
  # cares most about. 667 for younger children or after repeated
  # failure; 400 as a stretch. Leave it at one of those three.
  beat_ioi_ms: 500
  # Session shape: rounds of words with a proper rest between rounds,
  # and a whole-session ceiling so an engaged child still stops in
  # time. Each finished round stamps a sticker onto the session's
  # walking strip on the rest screen, runs of fully right words light
  # up to three corner stars (3, 5 and 8 in a row), and moving up a
  # word band shows a one-shot Bigger words card. All of it is fixed
  # and earned, never random, and nothing is ever taken away; the
  # research case lives in the mode file's REWARD LAYER section.
  # 40 words in rounds of 10 measures out at about 8 and a half
  # minutes, which is what a child of this age will actually sit
  # through. It was 50 (measured at 10 and a half minutes; the old
  # comment here guessed 15). Nothing in the design rests on the
  # number of words: the mastery rule is per ROUND (8 of the last 10
  # promotes, under 5 demotes) and round_size is unchanged, so the
  # band staircase still gets four full evaluation windows a session,
  # and the NRP dose window the mode docstring cites is a whole-
  # program figure across sessions, not a per-session one.
  words_per_block: 40
  round_size: 10
  break_s: 30
  # Ten free taps along with the tick before the first word: warms the
  # hand up, checks the sensors are seeing the child's taps, and gives
  # the analysis a tapping-steadiness reading every session.
  warmup_taps: 10
  # Seconds the word is shown (and spoken, on a Mac) before the blocks
  # start lighting.
  attend_s: 1.5
  # How long the child has to tap back when there is no beat to follow
  # (levels 1, 2, 5 and 6). Generous on purpose: nothing in this mode
  # rewards answering fast.
  free_window_s: 6.0
  # Beat-paced levels: ticks counted in before the child taps, and the
  # extra time after the last expected beat before the word is scored.
  count_in_beats: 4
  paced_grace_ms: 1000
  # A tap counts as on the beat within this many ms either side.
  # Children swing wide, so 150 is deliberately soft; the exact gap to
  # the beat is recorded for every tap regardless, so the analysis can
  # tighten this later without replaying anyone.
  on_beat_window_ms: 150
  # Level 4 accent: the strong beat must be pressed at least twice as
  # hard as the child's usual tap in that word, and the other beats
  # must stay under 1.5 times it. Relative to the child's own taps
  # because children differ hugely in how hard they press; never an
  # absolute force target.
  stress_ratio: 2.0
  unstressed_max_ratio: 1.5
  # Two touches on one finger inside this window count once. Sits on
  # top of the hardware debounce so a bouncy little finger cannot rack
  # up phantom extra taps.
  tap_debounce_ms: 150
  # Quiet gap between words, and the session ceiling. The block ends
  # politely at the next word boundary after the cap.
  inter_trial_gap_ms: 800
  session_cap_min: 20
  # After a wrong answer the word's blocks play through once more,
  # then the game moves on. Once, ever: watching reruns is not
  # practice. No error sound plays anywhere in this mode.
  replay_on_error: true
  # On a Mac the word is spoken aloud once as it appears, using the
  # system voice. Set a specific voice name (e.g. Karen, the
  # Australian one) with say_voice. Off, or on any other machine, the
  # mode plays the same without speech.
  speak_words: true
  say_voice: null
  # Set an integer to replay a block's exact word order (testing, or a
  # deliberately repeated protocol). Empty draws fresh each block and
  # records it in raw.csv.
  seed: null

force_pilot:
  # Force Pilot: one finger's continuous force flies a craft through a
  # scrolling corridor. The research case for every number lives in
  # rehab/game/modes/force_pilot.py; this block says what the patient
  # experiences. Needs the force pads: the mode says so on screen and
  # refuses to run from the keyboard. Session max presses are probed
  # in the mode when missing or older than six hours, and every force
  # target below is a PERCENTAGE of that finger's probed max, never a
  # raw sensor value.

  # How many runs each finger is owed. The weakest fingers (highest
  # tracking error so far) get extra runs on top through the floor-
  # weighted scheduler; min_finger_share is the floor that stops the
  # weighting starving any finger below an analysable count.
  runs_per_finger: 2
  min_finger_share: 0.15
  # Force-to-altitude mapping: 0 to span_pct of the finger's max fills
  # the screen height. Low force is where the cited deficits live, and
  # staying under half of max keeps repeated runs sub-fatiguing.
  span_pct: 40
  # Run shape, all in percent of max and seconds. base is the resting
  # altitude the run opens on; plateau is the top of the ramp; the
  # ramp rate is drawn per run from ramp_rates_pct_s and logged. The
  # sine and the sum-of-sines assessment sections draw frequencies
  # inside the level's bandwidth; the assessment's seed and drawn
  # numbers ride the trial row for exact offline rebuilds.
  base_pct: 8
  plateau_pct: 28
  ramp_rates_pct_s: [5, 10]
  hold_in_s: 3.0
  hold_top_s: 3.0
  sine_amp_pct: 9
  sine_s: 6.0
  sos_amps_pct: [6, 3.5, 2.5]
  sos_s: 8.0
  pre_assess_s: 1.0
  # Difficulty ladder: level n uses corridor_halfwidth_pct[n-1] and
  # bandwidth_hz[n-1]. The corridor narrows and the waveforms speed up
  # together; every move is announced on screen and logged. Promotion
  # needs two runs at or above promote_frac time-in-corridor; one run
  # below demote_frac drops back.
  level: 1
  corridor_halfwidth_pct: [8, 6, 4]
  bandwidth_hz: [0.3, 0.45, 0.6]
  promote_frac: 0.8
  demote_frac: 0.4
  # Visual gain magnifies the DISPLAYED error only (craft shows
  # target + gain x error; scoring always uses the true force).
  # Archer 2017 shows gain moves patient error substantially, so hold
  # it constant within any comparison; it is logged per run.
  visual_gain: 1.0
  # Rings sit on the corridor centreline and collect when the craft
  # passes them inside the corridor; each is worth ring_points on top
  # of the run outcome.
  ring_interval_s: 1.5
  ring_points: 2
  # Corridor-exit buzz: tactile error feedback on the working finger.
  # Rides the cue.buzz_after switch (so a silent-error block stays
  # separable in the CSV) with a cooldown so edge wobble cannot drone.
  exit_buzz_ms: 80
  exit_buzz_cooldown_s: 1.0
  # Max-press probe: presses per finger (median kept), the counts a
  # press must clear to count as an attempt, and how old a stored max
  # may be before it is re-measured.
  probe_presses: 3
  probe_floor_counts: 30
  probe_max_age_s: 21600
  # Between-run pacing: the who-flies-next announcement and the rest
  # that shows the run's scores.
  announce_s: 2.5
  rest_s: 10.0
  # Set an integer to replay a block's exact run plans (testing, or a
  # deliberately repeated protocol). Empty draws fresh each block and
  # records it in raw.csv.
  seed: null
  # Quiet background music during a Force Pilot block, and only there.
  # Basil asked for it: the runs are long silent holds and a track
  # keeps a block from dragging. It draws on the licensed menu
  # playlist (audio.menu_music_tracks), starts once the menu music
  # has faded, and stops with the block. Gameplay audio is otherwise
  # a recorded condition, so no other mode reads these keys, and
  # config/eeg_lab.yaml turns it off so the lab records in silence.
  # The mode never reads the stream: scoring is the same with it on
  # or off (tests/test_force_pilot_music.py pins the rows).
  music_enabled: true
  # Fraction of master_volume. Kept under the menu level (0.32 of
  # master by default) so the track sits behind the exit buzz and the
  # ring chime rather than beside them.
  music_volume: 0.2

lighthouse:
  # Lighthouse: hold a low force to keep a lantern lit, with the
  # visual feedback fading out mid-hold at higher levels, plus echo
  # trials that reproduce a remembered force after a delay. The
  # research case for every number lives in
  # rehab/game/modes/lighthouse.py; this block says what the patient
  # experiences. Needs the force pads (no keyboard fallback), probes
  # session max presses when missing or stale, and every force target
  # below is a PERCENTAGE of that probed max, never a raw sensor
  # value. This mode never buzzes during a trial: a buzz inside a
  # hold would hand the patient a tactile reference exactly when the
  # design removes the visual one. The only motor event is the shared
  # after-press confirmation at trial close (cue.buzz_after), and
  # failures never buzz at all.

  # How many hold and echo trials each finger is owed. Counts stay
  # equal per finger and per hand (paired balancing): the lit-dark
  # comparison needs the same amount of data from every finger.
  holds_per_finger: 2
  echoes_per_finger: 1
  # Target band, percent of the finger's probed max. 5 to 25 percent
  # is where the cited steadiness and CTS hold deficits live.
  target_lo_pct: 5
  target_hi_pct: 25
  # One hold's length and the in-band tolerance either side of the
  # target (the band the flame reads as steady, and the ignite band).
  hold_s: 16.0
  tol_pct: 3.0
  # Feedback fade ladder: level n blanks dark_windows[n-1] windows
  # totalling dark_fraction[n-1] of the hold. Every hold keeps a lit
  # lead-in, lit gaps between dark windows and a lit tail so the
  # relight can reveal the drift. Level 1 is fully lit.
  level: 1
  dark_windows: [0, 1, 2]
  dark_fraction: [0.0, 0.25, 0.45]
  lit_lead_s: 3.0
  lit_gap_s: 2.0
  lit_tail_s: 2.0
  # The ladder moves on the lit-dark error delta (the Li 2015
  # discriminator): two holds at or under promote_delta_pct promote,
  # one hold at or over demote_delta_pct drops back. Level 1 has no
  # dark data, so it promotes on lit accuracy alone.
  promote_lit_mae_pct: 1.5
  promote_delta_pct: 1.5
  demote_delta_pct: 6.0
  # Igniting the lantern: the flame must sit in the band this long to
  # light, and a trial that never ignites gutters gently after the
  # timeout (no buzzer, no klaxon; the flame just slips away).
  ignite_hold_s: 0.5
  ignite_timeout_s: 10.0
  # Echo trials: match the shown glow for show_s, wait one of the
  # delays (each delay gets equal trials), then remake it blind; the
  # settled tail of the reproduce window is what gets scored. With
  # both hands connected the echo goes cross-hand: one hand studies
  # the glow, the same finger on the other hand repeats it.
  echo_show_s: 3.0
  echo_delays_s: [2, 5, 10, 15]
  echo_reproduce_s: 4.0
  echo_settle_s: 2.0
  # Points for a dark window held within tolerance, on top of the
  # trial outcome.
  dark_bonus_points: 2
  # Max-press probe: same flow and meaning as force_pilot's.
  probe_presses: 3
  probe_floor_counts: 30
  probe_max_age_s: 21600
  # Between-trial pacing: the who-holds-next announcement and the
  # rest that shows the trial's numbers.
  announce_s: 2.5
  rest_s: 6.0
  # Set an integer to replay a block's exact trial plans (testing, or
  # a deliberately repeated protocol). Empty draws fresh each block
  # and records it in raw.csv.
  seed: null

buzz_hunt:
  # Buzz Hunt: the vibrotactile perception suite. The buzz IS the
  # stimulus, so these pulses bypass the cue.* before-press switches
  # by design (after-press feedback still honours them), and nothing
  # on screen ever names the target finger. The research case for
  # every number lives in rehab/game/modes/buzz_hunt.py; this block
  # says what the patient experiences. Needs the hardware: a keyboard
  # cannot buzz a finger, and the mode says so on screen. One block
  # runs the stage ladder in order: localisation, cross-hand
  # distractors (both-hands sessions only), sequence span, gap
  # detection.

  # Localisation: trials per hand (fingers stay balanced within the
  # hand), and the share of trials where nothing buzzes at all. Catch
  # trials price guessing: the false-alarm rate they produce is what
  # makes the accuracy numbers readable.
  loc_trials_per_hand: 32
  catch_rate: 0.1
  # Pulse duration staircase (2-down 1-up per hand, converging on
  # 70.7 percent correct). All in ms of REQUESTED duration; delivered
  # pulses stretch by up to about a frame and the motor's rise time
  # sits on top, which is why the floor is 40 (the measured region
  # where shorter requests stop being distinguishable) and the step
  # never goes below 17 (one display frame). Thresholds are
  # within-person measures only; see the mode docstring.
  start_ms: 300
  step_ms: 40
  floor_ms: 40
  ceil_ms: 500
  # How many of the last reversals average into the threshold
  # estimate.
  threshold_reversals: 6
  # Distractor stage (both hands only): trials per hand, and how far
  # ahead of the target the other hand's decoy pulse starts. These
  # trials run at the staircase's current level without moving it.
  distractor_trials_per_hand: 8
  distractor_lead_ms: 150
  # Sequence span: total trials, the opening sequence length, the
  # pulse length and onset-to-onset spacing of the playback, and how
  # often the hidden repeating sequence returns (every Nth span
  # trial). The hidden sequence is derived from the participant name,
  # so it is the same every session; do not mention it to players.
  span_trials: 10
  span_start: 2
  span_pulse_ms: 150
  span_ioi_ms: 400
  hebb_every: 3
  # Gap detection: trials per hand; one long buzz (two shorts plus
  # the gap, so length never gives it away) or two shorts with a
  # silent gap between. The gap staircases down as above; the floor
  # respects the frame-quantised stop-start path.
  gap_trials_per_hand: 20
  gap_start_ms: 200
  gap_step_ms: 25
  gap_floor_ms: 35
  gap_short_ms: 80
  # Trial pacing: the unpredictable quiet wait before each stimulus
  # (uniform draw between these bounds, so the buzz cannot be timed),
  # the response window, and the extra replay time per span item.
  wait_lo_s: 0.8
  wait_hi_s: 2.2
  response_window_s: 3.0
  replay_item_s: 1.5
  # Between-trial pacing and the stage cards that explain each task.
  # Neither number protects anything: the wait that has to stay
  # unpredictable is wait_lo_s to wait_hi_s above, which is the
  # foreperiod inside the trial. These two only decide how long the
  # ready card and the result card sit there. Trimmed from 2.0 and
  # 3.0, which across 62 trials was over five minutes of an eleven
  # minute block spent reading cards.
  announce_s: 1.5
  rest_s: 2.0
  stage_intro_s: 5.0
  # Hard cap on the whole block, minutes. Enforced between trials
  # only, so a trial in flight always finishes and is scored; the
  # block ends at the next card with everything already played kept
  # and end_reason time_cap in the summary. Measured on a headless
  # simulated block at these settings: one hand runs about 8.5
  # minutes for an ordinary responder and 9.9 in the worst case
  # (nobody responds, every window expires); both hands about 16.8
  # and 19.7. Sustained tactile discrimination is attention-heavy,
  # and past a quarter hour the tail trials measure fatigue more
  # than perception, so 15 leaves one-hand blocks untouched and
  # trims only the slowest bilateral tail. Raise it for a protocol
  # that must have every bilateral gap trial.
  session_cap_min: 15
  # Set an integer to replay a block's exact trial plans (testing, or
  # a deliberately repeated protocol). Empty draws fresh each block
  # and records it in raw.csv. The hidden repeating sequence comes
  # from the participant name, not from this seed.
  seed: null

echo:
  # Echo: the Simon-says span game. The rig plays a growing sequence
  # (tile light plus a buzz on that finger), the patient replays it,
  # and the longest echo is the headline. The research case for
  # every number lives in rehab/game/modes/echo.py; this block says
  # what the patient experiences. Plays fine on a keyboard: the
  # stimulus is on screen, the buzz reinforces it.

  # The ladder (the Kessels 2000 Corsi standard, the digit-span twin
  # of the same rule): start at 2 items, two different sequences per
  # length, up one length while at least one of the two comes back
  # right, block over when both fail, ceiling 9. runs adds extra
  # ladders per block for more trials; the standard is one.
  start_len: 2
  trials_per_len: 2
  max_len: 9
  runs: 1
  # Presentation: 500 ms lit, 1000 ms onset to onset, the eCorsi
  # pinning of the one-item-per-second standard. NEVER speeds up
  # with success (the toy accelerates; a measure must not). Changing
  # these is a protocol deviation the analysis splits out, so leave
  # them unless the deviation is deliberate.
  item_on_ms: 500
  ioi_ms: 1000
  # Every Nth trial secretly replays the participant's hidden
  # sequence (derived from the name, stable across sessions). Do not
  # mention it to players.
  hebb_every: 3
  # Reproduction is self-paced and never scored on speed; this is
  # only how long a silent hand gets before the trial closes as a
  # timeout.
  idle_timeout_s: 10.0
  # Short breather between trials, skippable like every wait.
  rest_s: 2.0
  # Two straight timeouts force a rest of fatigue_rest_s; a second
  # forced rest ends the block gracefully.
  fatigue_timeout_run: 2
  fatigue_rest_s: 20.0
  # Hard cap on the whole block, minutes, enforced at trial close. A
  # ladder to span 6 is about 12 trials and a few minutes; the cap
  # only catches a run that keeps passing at long lengths.
  session_cap_min: 10
  # Set an integer to replay a block's exact novel sequences. Empty
  # draws fresh each block and records the seed in raw.csv. The
  # hidden sequence comes from the participant name, not from this.
  seed: null
  # Classic Simon appending (one sequence growing by one item per
  # success, over on the first slip). Play value only: rehearsed
  # prefixes inflate the span, so cumulative blocks are marked in
  # the data and never comparable to ladder blocks.
  cumulative: false

rhythm:
  difficulty: medium     # easy | medium | hard
  # Seconds after the visual countdown ends before the audio starts +
  # the first beat is due. Gives the falling-notes visualiser time to
  # ramp in so the patient sees notes sliding down before they need to
  # press one. The 3 s countdown ticking from "3" to "GO" still runs;
  # this is an ADDITIONAL silent ramp on top of it.
  pre_song_lead_s: 2.0
  # Difficulty is NOT config-driven: how many notes fire per difficulty
  # lives in code as _DIFFICULTY_STRIDE / _DIFFICULTY_KEEP_FRAC /
  # _DIFFICULTY_MIN_GAP_S / _DIFFICULTY_MAX_GAP_S in
  # rehab/audio/beatmap.py, because tuning them needs the onset-
  # strength data those functions already have in scope. Edit that
  # file, not this one, to change beat density per difficulty.
  perfect_ms: 50
  great_ms: 100
  good_ms: 175
  miss_ms: 300
  # Audio-output latency compensation. pygame.mixer's buffer + the OS
  # audio path add ~20-50 ms between when our song_time clock thinks a
  # beat occurs and when the patient actually HEARS it. Without this
  # the patient's "on the beat" press lands as ~40 ms Late even when
  # they're perfectly in time. Default 40 ms is the typical pygame
  # latency on macOS / Windows; bump it up if presses still feel late,
  # or down toward 0 if they feel early. Only applied while a song is
  # actually playing; a keyboard-only or audio-disabled session has
  # nothing to compensate for and gets 0.
  audio_offset_ms: 40
  # Same idea for the click-track metronome fallback (no song file).
  # The metronome uses the same 512-sample mixer buffer, ~12 ms at
  # 44.1 kHz, far less than a decoded song's latency.
  metronome_offset_ms: 12
  # WHEN THE BUZZ HAPPENS, relative to the beat. The tone, the
  # falling note and the EEG stimulus marker always sit on the scored
  # beat (note time plus the audio offset above); this switch only
  # moves the buzzer.
  #
  #   lead      the STIM command goes out buzz_lead_ms plus the motor's
  #             rise (latency.buzzer_ms) BEFORE the beat, so a player
  #             who REACTS to the buzz lands on the beat instead of a
  #             reaction time behind it. Adaptation below then tunes
  #             the lead to the player: a predictor's lead shrinks to
  #             0 (buzz on the beat), a reactor's settles at their own
  #             reaction time. The buzz is marked as its own EEG event
  #             (22) and the beat byte drops the buzzer bit.
  #   on_beat   the STIM command goes out on the beat minus the motor
  #             rise only, no lead and no adaptation. This is the
  #             pre-September behaviour once the rise is 0.
  #   feedback  no cue buzz at all; the pressed finger buzzes for
  #             motor.cue_ms the instant a press scores a hit
  #             (Perfect, Great or Good). The fallback if leading the
  #             beat does not suit a player.
  #
  # Measured on a fake wire at 60 Hz with the shipping numbers (lead
  # 150, buzzer latency 45): the STIM command led the scored beat by
  # 195 ms, jitter within half a frame either side; in feedback mode
  # the STIM followed the press by the frame drain, under one frame.
  tactile_mode: lead
  # Reaction allowance for lead mode, in ms. 150 is the fastest
  # healthy touch reaction time in the literature (Robinson 1934,
  # via Kosinski's 2013 review); Bao et al. 2019 put vibrotactile
  # simple RT at about 200 ms in young adults and 250 ms in older
  # adults with coin ERM tactors, so a reactor starts a little late
  # and adaptation raises the lead toward them within three updates.
  buzz_lead_ms: 150
  # Adaptation: every buzz_lead_every scored hits, take the median of
  # the last buzz_lead_window hit offsets (Perfect, Great, Good only;
  # Early, Late and Miss are excluded so one wild press cannot move
  # the cue) and move the lead by buzz_lead_gain times that median,
  # at most buzz_lead_step_ms per update, clamped to 0 and
  # buzz_lead_max_ms. A late median raises the lead, an early one
  # lowers it. Gain 0.5 on a 4-hit period converges in about three
  # updates without overshoot; 25 ms is under the Great window so one
  # update cannot flip a hit into a miss. The lead in force is written
  # on every trial row (waveform_params) and carried across blocks
  # within a login session, so block two starts where block one
  # ended.
  buzz_lead_adapt: true
  buzz_lead_window: 8
  buzz_lead_every: 4
  buzz_lead_gain: 0.5
  buzz_lead_max_ms: 400
  buzz_lead_step_ms: 25
  # Bench-measured command-to-felt time for THIS rig's motors, in ms,
  # subtracted from the buzz target in every tactile mode so the felt
  # vibration, not just the command, sits where the mode wants it.
  # 0 (shipping) means "use latency.buzzer_ms", the datasheet-class
  # estimate documented in the latency block; set a number here only
  # from your own measurement (scripts/latency_check.py).
  buzz_rise_comp_ms: 0

latency:
  # HOW LONG EACH STIMULUS TAKES TO REACH THE PATIENT after the
  # software commands it. The software cannot see any of these; they
  # are constants the rig owner measures once. Used in three places:
  # rhythm sends the buzz command buzzer_ms early so the felt
  # vibration lands where the mode wants it (rhythm.tactile_mode);
  # rhythm draws the falling note visual_ms early so the note reaches
  # the strike line on the retina on the audible beat; and every EEG
  # block copies the four values below and the derived
  # marker-to-stimulus offsets into metadata.json (eeg.latency and
  # eeg.marker_offsets_ms) so epochs can be shifted from the byte to
  # the stimulus.
  #
  # measured: false means every number here is a datasheet or
  # first-principles estimate for this class of hardware, not a
  # measurement of this rig. Run scripts/latency_check.py with a phone
  # at 240 fps or a piezo disc (procedure in the script), put the
  # medians here, set measured true and the date.
  measured: false
  measured_on: null
  # Host STIM command to first FELT motion of the pad, in ms.
  #   USB write plus 7 bytes at 115200 baud       about 1 ms
  #   one firmware loop (200 Hz sample block)      0 to 5 ms, mean 2.5
  #   10 mm coin ERM lag to first motion           about 40 ms
  # (Precision Microdrives 310-103 class values: lag 40 ms, rise to
  # full amplitude 87 ms, stop 115 ms after current off). So about 45
  # ms to the first felt motion and about 95 ms to full amplitude;
  # the first number is the one a reaction is timed from.
  buzzer_ms: 45
  # Flip return to a mid-screen tile changing on a 60 Hz monitor with
  # vsync, in ms: half a scan (8 ms of the 16.7 ms frame) plus pixel
  # response (4 to 10 ms TN, 8 to 16 ms IPS), no signal-processing
  # lag assumed. A television or a monitor with processing on adds
  # tens of ms; only a photodiode gives the real number.
  visual_ms: 20
  # Cue tone dispatch to sound, in ms: the mixer's 512-sample buffer
  # at 44.1 kHz, the same path rhythm.metronome_offset_ms compensates.
  # A decoded song carries more (rhythm.audio_offset_ms); this is the
  # short-sound path the stim tone takes. Measure with an audio
  # loopback if the tone ERP is analysed.
  tone_ms: 12

audio:
  enabled: true
  # master_volume scales the WHOLE game (music, cues, feedback). The two
  # levels below sit on top of it so the clinician can balance the press
  # cue against the confirmation chime without touching the overall level.
  # Final volume of a sound is master x category x trial_gain x a fixed
  # per-sound factor. All three are set from the Settings screen and
  # persist to user_settings.yaml.
  master_volume: 0.8
  # Pre-press cue level: the metronome click in classic / adaptive (the
  # "go" tick the patient hears before they press).
  cue_volume: 1.0
  # Post-press feedback level: the hit chime + miss thunk after a press.
  feedback_volume: 1.0
  music_dir: assets/music
  # Menu music: a shuffled playlist that plays on the menu screens
  # only (login, game select, the hand picker and results). It fades
  # out when any block starts and never plays during gameplay, because
  # gameplay audio is a recorded condition and a background track
  # under a block would be an uncontrolled stimulus. Rhythm mode's own
  # songs are separate and unaffected. Both keys are set from the
  # Settings screen and persist to user_settings.yaml. Each person can
  # also mute the menus for themselves with the corner button on any
  # menu screen (M); that choice is remembered per participant in
  # session.prefs_file, not here.
  menu_music_enabled: true
  # Level as a fraction of master_volume, like the other category
  # levels. null (the default) means half as loud as the game music:
  # Basil found the menus too loud against the rhythm songs, which
  # play at master_volume. Half as LOUD is 10 dB down, an amplitude of
  # 0.32, not 0.5: perceived loudness halves per 10 dB (the sone
  # scale), and the old 0.5 was only 6 dB down, about two thirds as
  # loud. Deriving it keeps the ratio when master moves. A number 0 to
  # 1 pins the level instead; the Settings MUSIC slider writes one.
  menu_music_volume: null
  # Which files from music_dir the menu playlist draws on. Named
  # explicitly rather than "everything in the folder" so the rhythm
  # library can grow without the menus picking up a slow ambient track
  # that was added for gameplay pacing. Missing files are skipped with
  # a log line, so a renamed track cannot stop the app.
  menu_music_tracks:
    - Wallpaper.mp3
    - Life_of_Riley.mp3
    - Fluffing_a_Duck.mp3
    - Happy_Alley.mp3
    - Beachfront_Celebration.mp3
    - Vivacity.mp3
  # Per-lane stim cue tone (C, E, G, C, repeating for bilateral) that
  # fires the moment a stim is dispatched. SUPERSEDED by
  # cue.sound_before, which is the switch the game reads now and the
  # one the Settings screen writes. Kept here because a
  # user_settings.yaml that turned this off is translated onto
  # cue.sound_before at load, so an existing silent setup stays
  # silent. Nothing reads this key at run time.
  stim_tone_enabled: true
  # Programmatic loudness variation. On a small fraction of trials,
  # spread evenly across the whole session (not random clusters), the
  # cue + feedback play slightly louder. This is automatic, not a manual
  # per-patient knob: it keeps the auditory cue salient so the patient
  # doesn't habituate to a constant level over a long training block.
  # fraction 0.10 = roughly 1 in 10 trials; boost 1.35 = 35% louder on
  # those trials. Set fraction to 0 to disable.
  loud_trial:
    fraction: 0.10
    boost: 1.35

ui:
  resolution: [1280, 800]
  # Boot fullscreen (kiosk-style clinical use). F10 toggles to a
  # windowed view at runtime. The render size stays 1280x800 either
  # way; the display opens with SCALED so it upscales to fit the monitor.
  fullscreen: true
  theme: clinical
  font_scale: 1.0

logging:
  level: INFO
  file: sessions/rehab.log

# Optional pretest / main / aftertest protocol. When `blocks` is a
# non-empty list, calling GameEngine.start_protocol() runs the
# blocks back-to-back with the named `phase` written into each
# trial CSV row's `phase` column. Useful for learning-effects
# studies where you want to compare baseline (pretest) and post-
# training (aftertest) on either side of a main training block.
#
# Default is empty so existing free-play flow is unaffected. To
# enable, override in user_settings.yaml or pass --config a YAML
# like:
#   protocol:
#     blocks:
#       - {mode: classic,  phase: pretest}
#       - {mode: adaptive, phase: main}
#       - {mode: classic,  phase: aftertest}
protocol:
  blocks: []

  # Named presets the hub can start with one button. A preset is a
  # protocol with three things blocks: [] does not have: a fixed
  # block ORDER chosen per participant (counterbalanced by the code),
  # a HAND per step resolved against the dominant hand entered at
  # login, and per-mode OVERRIDES applied for the length of the run
  # and put back afterwards. Between steps the results screen shows
  # as normal and NEXT UP offers the next step, so every block still
  # gets its GET READY countdown and the participant a breather.
  #
  # The study_battery preset is the healthy baseline battery from
  # docs/research/healthy_baseline_study.txt, Sections 2.2 to 2.4.
  # Every override below changes a COUNT or freezes a difficulty
  # ladder; none changes a threshold, a window or a scoring rule, so
  # every metric a battery block writes is the metric the standard
  # block writes, just from fewer trials.
  presets:
    study_battery:
      id: healthy_baseline_v1
      # The design's minute budget for one visit, login to last
      # block. scripts/measure_battery.py measures the battery
      # headless against it.
      budget_min: 50
      # Steps that carry stretch_before get a 60 s stretch note on
      # the results screen before they start (the set boundary).
      stretch_s: 60
      # hand values: hand1 / hand2 are the counterbalanced order
      # (which one is dominant comes from the cell); dominant,
      # non_dominant, both, left and right are literal.
      orders:
        A:
          - {mode: reaction, hand: hand1}
          - {mode: reaction, hand: hand2}
          - {mode: mirror, hand: both}
          - {mode: rhythm, hand: both, track: Easy_Lemon.mp3,
             difficulty: medium}
          - {mode: echo, hand: both}
          - {mode: force_pilot, hand: both, stretch_before: true}
          - {mode: lighthouse, hand: both}
          - {mode: chords, hand: both}
          - {mode: buzz_hunt, hand: both}
          - {mode: pattern, hand: dominant}
        B:
          - {mode: force_pilot, hand: both}
          - {mode: lighthouse, hand: both}
          - {mode: chords, hand: both}
          - {mode: buzz_hunt, hand: both}
          - {mode: reaction, hand: hand1, stretch_before: true}
          - {mode: reaction, hand: hand2}
          - {mode: mirror, hand: both}
          - {mode: rhythm, hand: both, track: Easy_Lemon.mp3,
             difficulty: medium}
          - {mode: echo, hand: both}
          - {mode: pattern, hand: dominant}
      # Code number mod 4 -> which order and which hand goes first.
      # data/intake.cell_for applies the same table; a name with no
      # number hashes into it so the cell is still fixed per person.
      cells:
        1: {order: A, hand1: dominant}
        2: {order: B, hand1: dominant}
        3: {order: A, hand1: non_dominant}
        0: {order: B, hand1: non_dominant}
      # Short forms and frozen ladders, exact keys, applied on top of
      # whatever config is loaded while the battery runs.
      overrides:
        reaction:
          sub_mode: choice
          block_trials: 25
          response_windows_s: [2.0]   # one rung: the window never moves
        force_pilot:
          runs_per_finger: 1          # 8 runs bilaterally
          rest_s: 5.0
          level: 1
          promote_frac: 1.01          # never promotes
          demote_frac: 0.0            # never demotes
        lighthouse:
          holds_per_finger: 1
          echoes_per_finger: 1
          echo_delays_s: [2, 10]
          rest_s: 4.0
          level: 3                    # two dark windows, 45 percent
          promote_lit_mae_pct: -1     # never promotes
          promote_delta_pct: -1
          demote_delta_pct: 1000      # never demotes
        chords:
          subblocks: 3                # within, within, cross
          trials_per_subblock: 20
          sync_windows_ms: [150]      # one rung: W fixed at 150 ms
        buzz_hunt:
          loc_trials_per_hand: 16
          distractor_trials_per_hand: 0
          span_trials: 8
          gap_trials_per_hand: 0
          catch_rate: 0.1
        pattern:
          short_session: true
          soc_cycles_per_block: 3
          random_block_trials: 32
        rhythm:
          difficulty: medium
